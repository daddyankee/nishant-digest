<script>
const data = {"date":"June 18, 2026","dayOfWeek":"Thursday","articles":[{"category":"HARDWARE","cols":12,"title":"Trump Says Apple to Partner with Intel on US Chip Manufacturing; Intel Stock Surges 13%","source":"Reuters","date":"Jun 18, 2026","summary":"President Trump announced on Truth Social that Apple has agreed to work with Intel to design and manufacture chips domestically, sending Intel stock up 13–18% in early trading. The preliminary agreement would help Apple diversify from TSMC dependence and marks a major win for Intel's foundry ambitions under CEO Lip-Bu Tan. The deal signals a broader push to onshore advanced semiconductor manufacturing amid AI-driven supply chain concentration concerns.","url":"https://www.reuters.com/business/trump-says-apple-work-with-intel-manufacture-chips-us-2026-06-18/"},{"category":"HARDWARE","cols":6,"title":"ASML, TSMC, and imec Demonstrate 300mm Integration of 2D-Material Transistors at 50nm Pitch","source":"imec / Digitimes","date":"Jun 18, 2026","summary":"ASML, TSMC, and imec announced the first demonstration of a robust, scalable 300mm manufacturing flow for 2D-material-based transistors — a critical step toward post-silicon logic scaling. The breakthrough achieves 50nm contacted poly pitch for both nFETs and pFETs using transition metal dichalcogenides like MoS₂. This brings 2D-material transistors closer to industrial viability, potentially extending Moore's Law into the angstrom era beyond TSMC's 2nm nanosheet node.","url":"https://www.imec-int.com/en/press/asml-tsmc-and-imec-bring-industry-ready-2d-material-transistors-closer-breakthrough-300mm"},{"category":"HARDWARE","cols":6,"title":"Apple CEO Tim Cook Says Price Hikes 'Unavoidable' as AI Demand Drives Memory Chip Shortage","source":"BBC / WSJ","date":"Jun 17, 2026","summary":"Tim Cook told the Wall Street Journal that Apple will raise product prices, calling increases 'unavoidable' as AI infrastructure demand drives DRAM and storage chip costs sharply higher. Morgan Stanley estimates a potential 15% average price increase across Apple's product lines. The shortage is expected to persist well beyond the June quarter as hyperscalers and AI labs compete for the same advanced memory supply.","url":"https://www.bbc.com/news/articles/c3wyxvqdx1zo"},{"category":"HARDWARE","cols":6,"title":"Intel 18A-P Process Node Enters Risk Production; Q2 Revenue Forecast Beats Estimates","source":"Reuters","date":"Jun 16, 2026","summary":"Intel's next-generation 18A-P manufacturing process entered risk production, delivering 9% higher performance or 18% lower power versus baseline 18A. CEO Lip-Bu Tan reversed his earlier stance and now views 18A as a potential foundry offering for external customers. Strong AI-driven CPU demand led Intel to forecast Q2 revenue of $13.8B–$14.8B, above analyst estimates, signaling a potential turnaround for Intel Foundry.","url":"https://www.reuters.com/technology/intels-new-manufacturing-tech-enters-initial-production-2026-06-16/"},{"category":"SECURITY","cols":6,"title":"Kodak Confirms Data Breach as ShinyHunters Extortion Deadline Hits June 18","source":"BleepingComputer","date":"Jun 17, 2026","summary":"Kodak confirmed a cybersecurity breach after the ShinyHunters extortion group claimed to have stolen over 2.2 million records including PII and internal data. The gang's 'final warning' deadline for Kodak to make contact lands today, June 18, before threatened data leakage. Kodak says it has engaged external cybersecurity experts and is investigating the incident.","url":"https://www.bleepingcomputer.com/news/security/kodak-confirms-data-breach-claimed-by-shinyhunters-extortion-gang/"},{"category":"SECURITY","cols":6,"title":"Accenture Strikes $4.18 Billion Cybersecurity Acquisition Deal","source":"Reuters","date":"Jun 18, 2026","summary":"Accenture announced it will take a majority stake and acquire multiple cybersecurity firms in a combined $4.18 billion deal, marking one of the largest cybersecurity acquisitions of the year. The deal expands Accenture's capabilities across threat detection, incident response, and managed security services as enterprise demand for cyber defense surges alongside AI adoption.","url":"https://www.reuters.com/legal/transactional/accenture-take-majority-stake-acquire-cybersecurity-firms-418-billion-deal-2026-06-18/"},{"category":"POLICY","cols":6,"title":"UAE Sets Minimum Social Media Age at 15, Mandates Age Verification","source":"Reuters","date":"Jun 18, 2026","summary":"The UAE Cabinet approved a resolution prohibiting children under 15 from creating or using personal social media accounts. Platforms will be required to implement age verification systems. The UAE joins Australia, Denmark, and a growing list of countries imposing social media age restrictions for minors, accelerating the global trend toward platform age-gating.","url":"https://www.reuters.com/technology/uae-sets-minimum-social-media-use-age-15-media-office-says-2026-06-18/"},{"category":"HARDWARE","cols":4,"title":"ASML Named Europe's Most Innovative Company for 2026 by Fortune","source":"Fortune","date":"Jun 18, 2026","summary":"ASML topped Fortune's second annual ranking of Europe's 300 most innovative companies. The Dutch semiconductor equipment maker was cited for two breakthrough innovations: the Twinscan XT:260 advanced packaging tool and high-NA EUV lithography systems enabling record chip processing power. Germany led with 56 companies on the list, followed by the UK and France.","url":"https://fortune.com/2026/06/18/inside-fortune-europes-most-innovative-companies-2026/"},{"category":"AI","cols":4,"title":"Samsung Unveils AI-Powered Pet Health Monitoring at VivaTech 2026","source":"Gadgets360","date":"Jun 18, 2026","summary":"Samsung announced an AI-powered pet care tool for Galaxy smartphones at VivaTech 2026 in Paris. Users can photograph their dog or cat and AI analyzes it for conditions like cataracts, dental issues, and joint problems with claimed 97% accuracy. It is the first mainstream smartphone-based pet health monitoring system requiring no dedicated hardware.","url":"https://www.gadgets360.com/ai/news/samsung-ai-pet-health-monitoring-tool-galaxy-smartphones-vivatech-2026-11649321"},{"category":"SECURITY","cols":4,"title":"Counter-Drone Tech Market Booms as Civilian Infrastructure Faces Growing Threat","source":"Reuters","date":"Jun 18, 2026","summary":"Drone incursions disrupting European airports and strikes on Middle Eastern oil fields are fueling a rapidly expanding counter-drone technology market, now estimated at $3–7 billion and growing 20% annually. Companies like Dedrone, Echodyne, and RobinRadar report surging demand from energy facilities, data centers, and shipping ports — well beyond traditional military customers.","url":"https://www.reuters.com/business/aerospace-defense/drone-strikes-beyond-battlefield-pump-up-market-technology-repel-them-2026-06-18/"},{"category":"SECURITY","cols":4,"title":"Japan Bank Lobby Warns of AI-Enabled Cyberattack Disruptions to Financial Services","source":"Reuters","date":"Jun 18, 2026","summary":"Japan's banking industry lobby warned that AI-powered cyberattacks pose a growing risk of disrupting financial services. The warning follows an IMF report that extreme cyber incidents could trigger funding strains and broader market disruptions. Japan is considering allowing financial institutions to proactively suspend systems when facing severe AI-enabled threats.","url":"https://www.reuters.com/legal/government/japan-bank-lobby-warns-potential-service-disruptions-due-ai-enabled-cyberattacks-2026-06-18/"},{"category":"POLICY","cols":4,"title":"India Temporarily Bans Telegram Over Medical Exam Paper Leaks","source":"TechCrunch","date":"Jun 16, 2026","summary":"India ordered Telegram blocked nationwide until June 22 under Section 69A of the IT Act, citing concerns the messaging platform was used to distribute leaked medical entrance exam papers. Telegram challenged the ban as unconstitutional but complied, routing traffic through AWS and Google Cloud backups. The restriction coincides with the NEET-UG re-examination.","url":"https://techcrunch.com/2026/06/16/india-temporarily-blocks-access-to-telegram-over-exam-fraud-concerns/"},{"category":"POLICY","cols":4,"title":"CIRCIA June 18 Town Hall: Last Call for Cloud and AI Providers on Incident Reporting Rules","source":"Cloud Security Alliance / CISA","date":"Jun 18, 2026","summary":"Today, June 18, marks the final CISA virtual town hall for CIRCIA rulemaking — the last scheduled formal input opportunity before the Cyber Incident Reporting for Critical Infrastructure Act final rule is issued. Cloud and AI providers face mandatory 72-hour incident reporting requirements and 24-hour ransomware payment disclosure. The rule will fundamentally reshape cybersecurity compliance for the AI infrastructure supply chain.","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-circia-rulemaking-cloud-ai-providers-20260/"},{"category":"AI","cols":4,"title":"Big Technology AI Summit Kicks Off Today in San Francisco with Top AI Leaders","source":"Big Technology","date":"Jun 18, 2026","summary":"The Big Technology AI Summit opens today at the Commonwealth Club in San Francisco. Host Alex Kantrowitz has previously interviewed AI's top leaders including Sam Altman, Dario Amodei, Demis Hassabis, and Yann LeCun. The summit arrives at a pivotal moment — Anthropic's Fable 5 remains offline entering Day 6 of the US export control directive, and the G7 AI safety commitments are fresh.","url":"https://summit.bigtechnology.com/"},{"category":"NEWS","cols":4,"title":"HPE Discover 2026 Concludes Today: AI-Native Networking and Hybrid Cloud Take Center Stage","source":"ServeTheHome / HPE","date":"Jun 18, 2026","summary":"HPE Discover Las Vegas 2026 wraps up today after four days of product announcements spanning AI-native networking, hybrid cloud infrastructure, and next-generation compute. CEO Antonio Neri's keynote emphasized that 'AI starts with the network,' positioning HPE's networking portfolio as the backbone for enterprise AI deployments. NVIDIA participated as a key partner, showcasing joint AI factory reference architectures.","url":"https://www.servethehome.com/hpe-discover-2026-keynote-coverage/"},{"category":"NEWS","cols":4,"title":"StrictlyVC Los Angeles 2026 Brings Venture Capital to El Segundo Today","source":"TechCrunch","date":"Jun 18, 2026","summary":"TechCrunch's StrictlyVC event lands in El Segundo, California today, bringing together top venture capitalists and startup founders in the heart of LA's growing tech ecosystem. The event coincides with VivaTech in Paris, making June 18 a globally distributed day for tech and venture convenings. LA's tech scene has grown significantly as AI talent disperses beyond the Bay Area.","url":"https://techcrunch.com/"},{"category":"SECURITY","cols":4,"title":"Nvidia Becomes First Company to Close Above $5 Trillion Market Cap","source":"Yahoo Finance / WSJ","date":"Jun 17, 2026","summary":"Nvidia became the first company in history to close above a $5 trillion market valuation on Wednesday. The milestone caps a trajectory from $2 trillion in March 2024 to $4 trillion by July 2025 to $5 trillion in June 2026. Nvidia's AI accelerator dominance — approximately 80% market share with $193.7B in FY2026 data center revenue — continues to drive extraordinary valuation growth.","url":"https://finance.yahoo.com/news/nvidia-becomes-first-company-to-close-above-5-trillion-market-cap-133101442.html"},{"category":"STARTUPS","cols":4,"title":"TSMC CEO: AI Boom Shows 'No Sign of Easing,' Company 'Working Very Hard' to Meet Demand","source":"Reuters","date":"Jun 4, 2026","summary":"TSMC CEO C.C. Wei said the AI-driven semiconductor boom shows 'no sign of easing' and the company is 'working very hard' to meet chip demand. Wei acknowledged that TSMC would 'like' to hike prices given supply constraints. The company's dominance in advanced process nodes — from 3nm through upcoming 2nm — positions it as the single most critical chokepoint in the AI supply chain.","url":"https://www.reuters.com/world/china/tsmc-boss-upbeat-outlook-ai-boom-shows-no-sign-easing-2026-06-04/"}],"physicsContent":[{"type":"section_heading","text":"EXPLANATION"},{"type":"heading","text":"Black Hole Thermodynamics: Where Gravity Meets Quantum Mechanics — and Information Theory"},{"type":"paragraph","text":"Black hole thermodynamics is arguably the most profound bridge between three pillars of modern physics: general relativity, quantum mechanics, and thermodynamics. It began in 1972 when Jacob Bekenstein made a startling conjecture: black holes must have entropy, and that entropy is proportional to the surface area of the event horizon — not the volume. This was deeply counterintuitive. Entropy normally scales with volume (think of a gas in a box). For a black hole, information seems to live on its surface."},{"type":"paragraph","text":"Stephen Hawking initially dismissed the idea, then proved it right in 1974. He showed that quantum effects near the event horizon cause black holes to emit thermal radiation — now called Hawking radiation — at a temperature inversely proportional to their mass. A black hole is not perfectly black; it glows. And if it glows, it has a temperature. If it has a temperature, it has entropy. The circle closes. The four laws of black hole mechanics form an exact parallel to classical thermodynamics. The zeroth law: surface gravity is constant across a stationary horizon. The first law: \\(dM = T_H dS_{BH} + \\Omega dJ + \\Phi dQ\\). The second law: horizon area never decreases. The third law: you cannot reach zero surface gravity through any finite process."},{"type":"paragraph","text":"The real electric charge of this field comes from what it implies. Entropy scaling with area suggests the holographic principle: all information contained in a volume of space can be encoded on its boundary. The universe may be a hologram. This idea has rippled outward from black hole physics into quantum information theory, condensed matter physics, and — as we'll see — machine learning. The information paradox sharpens the stakes: Hawking's original calculation suggested radiation carries no information about what fell in, but quantum mechanics forbids information destruction. Recent breakthroughs using the 'island formula' and entanglement wedge reconstruction show how the Page curve emerges naturally."},{"type":"subheading","text":"The Bekenstein–Hawking Entropy"},{"type":"paragraph","text":"The entropy of a black hole is one-quarter of its horizon area in Planck units:"},{"type":"formula","text":"\\[ S_{\\text{BH}} = \\frac{k_B c^3 A}{4 G \\hbar} = \\frac{k_B A}{4 \\ell_P^2} \\]"},{"type":"paragraph","text":"where \\(A\\) is the horizon area and \\(\\ell_P = \\sqrt{G\\hbar/c^3}\\) is the Planck length. In natural units (\\(G = \\hbar = c = k_B = 1\\)), this simplifies to the iconic \\(S_{\\text{BH}} = A/4\\). For a Schwarzschild black hole of mass \\(M\\), the horizon radius is \\(R_s = 2GM/c^2\\), giving \\(S_{\\text{BH}} = 4\\pi G M^2 / (\\hbar c)\\). A solar-mass black hole has \\(S \\sim 10^{77} k_B\\), vastly exceeding the entropy of the star that collapsed to form it."},{"type":"subheading","text":"Hawking Temperature"},{"type":"formula","text":"\\[ \\boxed{T_H = \\frac{\\hbar c^3}{8\\pi G M k_B}} \\]"},{"type":"paragraph","text":"A solar-mass black hole has \\(T_H \\approx 6 \\times 10^{-8} \\, \\text{K}\\) — colder than the cosmic microwave background. But a primordial black hole of mass \\(10^{12} \\, \\text{kg}\\) would have \\(T_H \\approx 10^{12} \\, \\text{K}\\), glowing brilliantly as it evaporates. The Page curve governs information recovery: before the Page time \\(t_{\\text{Page}}\\), entanglement entropy of radiation grows; after, it decreases — information comes out."},{"type":"subheading","text":"Real-World Test: GW250114 Validates Hawking's Area Law"},{"type":"paragraph","text":"On January 14, 2025, LIGO detected GW250114 — the clearest gravitational wave signal in history (SNR ~80). Two black holes of masses \\(33.6 M_\\odot\\) and \\(32.2 M_\\odot\\) merged 1.14 billion light-years away, producing a final black hole of \\(62.7 M_\\odot\\). The pre-merger total horizon area was ~240,000 km²; the final merged area was ~400,000 km². Hawking's area theorem holds with high precision — the area grew. Published in Physical Review Letters (September 2025), this is the strongest direct test of black hole thermodynamics to date."},{"type":"subheading","text":"2026 Research: Hawking Radiation from Quantum Tunneling"},{"type":"paragraph","text":"Chu (arXiv:2603.12199, March 2026) models a black hole as a fuzzy sphere with a half-filled Fermi sea. Hawking radiation corresponds to tunneling of this fuzzy sphere to a smaller configuration. A monopole on the fuzzy sphere provides zero modes to absorb excess fermion states, enabling a manifestly unitary decay process. The work provides, for the first time, a full multi-partite wave function of the Hawking quanta. Shafiee and Sheykhi (arXiv:2605.24487, May 2026) investigate quantum-corrected evaporation and find the temperature reaches a maximum then decreases, leaving an extremal remnant — resolving the runaway evaporation problem. The entropy acquires a logarithmic correction: \\(S \\sim A/4 + \\gamma \\ln A\\)."},{"type":"subheading","text":"Why This Matters for ML/AI Engineers"},{"type":"paragraph","text":"The deep connections run in both directions. First, the holographic principle is the ultimate dimensionality reduction theorem: \\(D\\)-dimensional physics encoded on a \\((D-1)\\)-dimensional boundary with no information loss. Neural networks learn compressed representations (latent spaces) that preserve essential structure — the holographic principle suggests this is how nature works. Second, Lee and Kim (arXiv:2506.09678) establish a striking formal correspondence: the black hole information paradox maps onto double descent in quantum machine learning. The Page time — when information begins emerging — corresponds exactly to the interpolation threshold where test error peaks then decreases with further overparameterization. Both are governed by the rank structure of underlying matrices."},{"type":"paragraph","text":"Third, Neural ODEs are being used to reconstruct black hole spacetime metrics from boundary entanglement entropy data (Ahn et al., JHEP 2025). The same continuous-depth architectures used in normalizing flows are probing the structure of quantum gravity. Fourth, the Bekenstein bound — the maximum information storable in a region, \\(I \\leq 2\\pi R E / (\\hbar c \\ln 2)\\) — sets a fundamental limit on physical computation. As ML pushes toward astronomical parameter counts, the physics of information storage at fundamental limits becomes practically relevant for understanding scaling laws. Fifth, the 2026 topological thermodynamics program — classifying black hole phase transitions by winding numbers — is conceptually identical to topological data analysis (persistent homology) already used to study neural network loss landscapes. The shared mathematical toolkit makes black hole thermodynamics one of the richest fields for cross-pollination between physics and ML."}],"mathContent":[{"type":"section_heading","text":"CONCEPT"},{"type":"heading","text":"The Fourier Transform: Decomposing Any Signal Into Its Pure Frequencies"},{"type":"paragraph","text":"The Fourier transform answers a question that seems almost magical: given a complex, messy signal — a sound wave, an image, a time series — how do you decompose it into the pure frequencies that compose it? As Kalid Azad puts it: 'Given a smoothie, it finds the recipe.' The transform takes a function of time (or space) and rewrites it as a function of frequency. Every signal becomes a continuum of rotating complex exponentials \\(e^{i\\omega t}\\), each weighted by how much of that frequency is present. The set of weights is the Fourier transform."},{"type":"paragraph","text":"Here's the 3Blue1Brown visualization that makes the formula unforgettable. Take your signal \\(g(t)\\) and imagine wrapping it around a circle. At each time \\(t\\), a vector rotates at some winding frequency \\(f\\), and we scale its length by the signal value \\(g(t)\\). Now find the center of mass of that wound-up shape. When the winding frequency matches a frequency present in the signal, the wound graph becomes lopsided — all the high signal values align to one side, pulling the center of mass far from the origin. At non-matching frequencies, the winding cancels out and the center of mass stays near zero. Scanning across all winding frequencies produces peaks exactly at the frequencies present in your signal. The Fourier transform is a physical 'frequency detector' built from rotation and averaging."},{"type":"subheading","text":"The Core Equations"},{"type":"formula","text":"\\[ \\boxed{F(\\omega) = \\int_{-\\infty}^{\\infty} f(t) \\, e^{-i\\omega t} \\, dt} \\quad \\text{(Fourier Transform)} \\]"},{"type":"formula","text":"\\[ \\boxed{f(t) = \\frac{1}{2\\pi} \\int_{-\\infty}^{\\infty} F(\\omega) \\, e^{i\\omega t} \\, d\\omega} \\quad \\text{(Inverse Transform)} \\]"},{"type":"paragraph","text":"The minus sign in the forward transform rotates clockwise, canceling any counterclockwise rotation in the signal at exactly the matching frequency — producing the peak. Derivation: start with a \\(T\\)-periodic function expressed as a Fourier series \\(f(t) = \\sum c_n e^{i n \\omega_0 t}\\) where \\(\\omega_0 = 2\\pi/T\\). The coefficients \\(c_n = \\frac{1}{T} \\int f(t) e^{-i n \\omega_0 t} dt\\) exploit orthogonality of sine waves. Let \\(T \\to \\infty\\): discrete frequencies become continuous, the sum becomes an integral, and we obtain the Fourier transform."},{"type":"subheading","text":"The Convolution Theorem (Crown Jewel)"},{"type":"paragraph","text":"Define convolution: \\((f * g)(t) = \\int_{-\\infty}^{\\infty} f(\\tau) g(t - \\tau) \\, d\\tau\\). Then:"},{"type":"formula","text":"\\[ \\boxed{\\mathcal{F}\\{f * g\\} = \\mathcal{F}\\{f\\} \\cdot \\mathcal{F}\\{g\\}} \\]"},{"type":"paragraph","text":"Convolution in the time domain becomes pointwise multiplication in the frequency domain. This is why the Fast Fourier Transform (FFT) accelerates convolution from \\(O(n^2)\\) to \\(O(n \\log n)\\) — transform, multiply, invert. Every deep learning framework's conv2d ultimately traces back to this idea. Key properties: the derivative becomes multiplication by \\(i\\omega\\) — differentiation, a finicky local operation, becomes trivial in frequency space. Time shift becomes a phase factor. The Parseval/Plancherel theorem guarantees energy conservation: \\(\\int |f(t)|^2 dt = \\frac{1}{2\\pi} \\int |F(\\omega)|^2 d\\omega\\)."},{"type":"subheading","text":"The Uncertainty Principle"},{"type":"paragraph","text":"A beautiful structural constraint: a function and its Fourier transform cannot both be sharply localized:"},{"type":"formula","text":"\\[ \\left( \\int (t - \\bar{t})^2 |f(t)|^2 dt \\right) \\left( \\int (\\omega - \\bar{\\omega})^2 |F(\\omega)|^2 d\\omega \\right) \\geq \\frac{1}{4} \\]"},{"type":"paragraph","text":"The Gaussian \\(f(t) = e^{-at^2}\\) saturates this bound — it is the only function that is its own Fourier transform (up to scaling). This explains the fundamental tradeoff in spectrogram resolution: wide windows give good frequency resolution but poor time resolution. Wavelets address this with variable-width windows — a multi-resolution approach that inspired scattering transforms in geometric deep learning."},{"type":"subheading","text":"Why This Matters for ML/AI Engineers"},{"type":"paragraph","text":"Fourier analysis permeates modern ML. Fourier Neural Operators (FNOs) learn in frequency space, achieving state-of-the-art results on PDEs like Navier-Stokes while being discretization-invariant — global integral operators become diagonal in the Fourier basis. Sinusoidal positional encodings in transformers are explicitly Fourier features: \\(\\text{PE}(pos, 2i) = \\sin(pos / 10000^{2i/d})\\), giving the model access to a frequency representation of position. The Nyquist-Shannon sampling theorem governs everything from audio processing to why you can't arbitrarily downsample images. Spectrograms (Short-Time Fourier Transform) produce the 2D time-frequency representations that underpin audio ML from Whisper to MusicGen. On graphs, eigenvectors of the Laplacian play the role of Fourier modes — spectral graph convolutions (ChebNet, GCN) filter in this spectral domain, generalizing classical Fourier analysis to irregular domains."},{"type":"video","video":{"title":"But what is the Fourier Transform? A visual introduction.","channel":"3Blue1Brown","duration":"20:57","url":"https://www.youtube.com/watch?v=spUNpyF58BY"}},{"type":"video","video":{"title":"Epicycles, complex Fourier series and Homer Simpson's orbit","channel":"Mathologer","duration":"25:34","url":"https://www.youtube.com/watch?v=qS4H6PEcCCA"}}],"deepContent":[{"type":"section_heading","text":"ANALYSIS"},{"type":"heading","text":"The Post-Silicon Transistor: How 2D Materials Will Power Next-Generation AI Chips"},{"type":"paragraph","text":"Today's announcement from ASML, TSMC, and imec — the first robust 300mm integration of 2D-material transistors at 50nm contacted poly pitch — is not just another process node refinement. It is a signal that the semiconductor industry is preparing for life beyond silicon. Combined with the Apple-Intel domestic chip manufacturing deal and TSMC's acknowledgment that AI demand shows 'no sign of easing,' this week's news paints a picture of an industry straining against physical limits while racing to meet insatiable AI compute demand. The question is no longer whether silicon will hit a wall, but what comes after — and who controls it."},{"type":"subheading","text":"The Silicon Scaling Problem"},{"type":"paragraph","text":"Silicon transistors have scaled from micrometers to nanometers over six decades, but fundamental physics now intervenes. At channel lengths below ~12nm, quantum tunneling through the gate oxide causes unacceptable leakage current. Short-channel effects degrade electrostatic control, and carrier mobility in ultra-thin silicon channels collapses due to surface roughness scattering. TSMC's 2nm (N2) node, now in volume production with nanosheet transistors, represents the last major silicon architecture before the atomic limit. The N2P enhancement with backside power delivery will push silicon to ~80% yield at 2nm, but the scaling path below 1.5nm is blocked by silicon's physical properties:"},{"type":"formula","text":"\\[ I_{\\text{leakage}} \\propto \\exp\\left(-\\frac{4\\pi t_{\\text{ox}}\\sqrt{2m^*\\phi_B}}{h}\\right) \\]"},{"type":"paragraph","text":"As the gate oxide thickness \\(t_{\\text{ox}}\\) shrinks below ~0.5nm, leakage current grows exponentially. Silicon channels thinner than ~3nm lose mobility due to quantum confinement effects. The industry's answer: replace silicon with materials that maintain electrostatic integrity at atomic thickness."},{"type":"subheading","text":"Why 2D Materials: The Physics"},{"type":"paragraph","text":"Transition metal dichalcogenides (TMDs) like molybdenum disulfide (MoS₂) and tungsten diselenide (WSe₂) are layered materials that can be exfoliated to single atomic layers — ~0.7nm thick. Unlike silicon, which loses carrier mobility when thinned below ~3nm, TMDs maintain high mobility at monolayer thickness because their band structure is inherently two-dimensional. The key physics: in bulk semiconductors, carriers scatter off surface roughness and dangling bonds that dominate at nanoscale dimensions. TMDs have naturally passivated surfaces with no dangling bonds — the layers are held together by weak van der Waals forces. A monolayer MoS₂ transistor has:"},{"type":"formula","text":"\\[ \\text{SS} = \\frac{k_B T}{q} \\ln(10) \\cdot \\left(1 + \\frac{C_{\\text{dep}}}{C_{\\text{ox}}}\\right) \\]"},{"type":"paragraph","text":"The subthreshold swing (SS) — the gate voltage needed to change current by a factor of 10 — has a theoretical minimum of 60 mV/decade at room temperature for conventional MOSFETs. 2D-material transistors can approach this limit more closely than ultra-thin silicon because the depletion capacitance \\(C_{\\text{dep}}\\) is lower in a naturally 2D channel. This means steeper switching, lower power consumption, and better performance at scaled dimensions."},{"type":"subheading","text":"The ASML/TSMC/imec Breakthrough: Why 300mm Matters"},{"type":"paragraph","text":"The critical barrier to 2D transistors has been manufacturing, not physics. Lab demonstrations on small flakes are common; industrial-scale integration on 300mm wafers is the real challenge. Today's announcement demonstrates for the first time a robust, scalable manufacturing flow for both nFET and pFET 2D-material transistors on full 300mm wafers at 50nm contacted poly pitch. The 300mm wafer scale is non-negotiable for economic viability: all modern fabs (TSMC, Intel, Samsung) use 300mm wafers. Demonstrating integration at this scale, with both polarities (n-type and p-type — CMOS requires both), moves 2D transistors from a lab curiosity to a potential manufacturing technology."},{"type":"subheading","text":"Geopolitical Stakes: Who Controls the Post-Silicon Era?"},{"type":"paragraph","text":"This week's Apple-Intel domestic chip manufacturing announcement takes on new significance in light of the 2D transistor breakthrough. If 2D materials represent the next transistor architecture, then the foundries and equipment makers who master 300mm TMD integration first will define the post-silicon era. TSMC currently dominates advanced silicon manufacturing, but 2D materials reset some of the incumbency advantage — the processes, materials, and metrology are different. Intel's 18A-P entering risk production and its newfound willingness to serve external foundry customers signals a bet that the transition to new materials could be a window of competitive opportunity. ASML, as the sole supplier of EUV lithography tools essential for both silicon and 2D patterning, remains the indispensable player regardless of which material wins."},{"type":"subheading","text":"What This Means for AI Hardware"},{"type":"paragraph","text":"The direct implication for AI: 2D-material transistors promise lower power per operation, enabling denser logic within the same thermal envelope — the binding constraint on AI accelerator design. Nvidia's H200 and B200 GPUs already operate at 700–1000W; further scaling with silicon alone would produce chips that are un-coolable in data center configurations. 2D transistors with steeper subthreshold swing reduce dynamic and static power simultaneously: \\(P_{\\text{dynamic}} \\propto C V^2 f\\) and \\(P_{\\text{static}} \\propto V \\cdot I_{\\text{leakage}}\\). A 2D transistor operating at lower \\(V_{dd}\\) with lower leakage delivers both performance and efficiency gains. For ML engineers, this means more FLOPS per watt, larger models that fit within practical power budgets, and potentially new architectures — 2D materials enable flexible electronics and 3D integration schemes that silicon cannot. The ASML/TSMC/imec announcement is the first concrete evidence that the post-silicon AI chip era has moved from theory to manufacturing development. The question is not if, but when — and who will own the supply chain when it arrives."}]};

// Theme switching functionality
function setTheme(themeName) {
  const root = document.getElementById('root');
  root.setAttribute('data-theme', themeName);

  // Update active state on theme dots
  document.querySelectorAll('.theme-dot').forEach(dot => {
    if (dot.getAttribute('data-theme') === themeName) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });

  // Persist theme preference to localStorage
  try {
    localStorage.setItem('digest-theme', themeName);
  } catch(e) {
    console.error('Failed to save theme preference:', e);
  }
}

// Load saved theme on page load
function loadSavedTheme() {
  try {
    const savedTheme = localStorage.getItem('digest-theme');
    if (savedTheme && ['parchment', 'sepia', 'nordic', 'dusk', 'graphite'].includes(savedTheme)) {
      setTheme(savedTheme);
    } else {
      setTheme('parchment');
    }
  } catch(e) {
    console.error('Failed to load theme preference:', e);
    setTheme('parchment');
  }
}

function renderTechNews() {
  return `<div class="tech-news-container" style="background: var(--tn-bg); padding: 48px 24px 80px; min-height: 100%;">
    <h1 style="font-family: Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; color: var(--tn-accent); border-bottom: 4px solid var(--tn-accent); padding-bottom: 24px; margin-bottom: 48px;">Tech News — ${data.date}</h1>
    <div id="tech-grid" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;">
      ${data.articles.map(a => `<div style="grid-column: span ${a.cols}; background: var(--tn-card); border: 2px solid var(--tn-border); padding: 24px;">
        <span style="display: inline-block; background: var(--tn-accent); color: var(--tn-bg); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 10px; margin-bottom: 16px; font-family: 'IBM Plex Mono'; text-transform: uppercase;">${a.category}</span>
        <h2 class="${a.cols === 12 ? 'article-title-large' : 'article-title-small'}" style="font-family: Georgia, serif; font-size: ${a.cols === 12 ? '36px' : '20px'}; font-weight: 700; color: var(--tn-ink); line-height: 1.12; margin-bottom: ${a.cols === 12 ? '20px' : '12px'};">${a.title}</h2>
        <p style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--tn-meta); margin-bottom: 14px;">${a.source} · ${a.date}</p>
        <p class="article-summary" style="font-family: 'IBM Plex Sans'; font-size: ${a.cols === 12 ? '16px' : '14px'}; line-height: 1.65; color: var(--tn-ink); opacity: 0.78;">${a.summary}</p>
        <a href="${a.url}" target="_blank" style="display: inline-block; font-size: 12px; font-weight: 600; color: var(--tn-accent); border-bottom: 1.5px solid var(--tn-accent); margin-top: 20px; text-decoration: none;">Read Full Article →</a>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderContent(blocks, bgVar, textVar, accentVar, fbgVar) {
  return blocks.map(b => {
    if (b.type === 'section_heading') return `<p style="font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(${accentVar}); opacity: 0.65; margin-bottom: 16px;">${b.text}</p>`;
    if (b.type === 'heading') return `<h2 class="content-heading" style="font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(${accentVar}); margin-bottom: 24px;">${b.text}</h2>`;
    if (b.type === 'paragraph') return `<p class="content-paragraph" style="font-family: Georgia, serif; font-size: 18px; line-height: 1.8; color: var(${textVar}); text-align: justify; margin-bottom: 20px;">${b.text}</p>`;
    if (b.type === 'formula') return `<div class="formula-block" style="padding: 28px 20px; margin: 32px 0; text-align: center; border-left: 3px solid var(${accentVar}); background: var(${fbgVar}); color: var(${textVar});">${b.text}</div>`;
    if (b.type === 'subheading') return `<h3 class="content-subheading" style="font-family: Georgia, serif; font-size: 22px; font-weight: 600; color: var(${textVar}); margin-top: 44px; margin-bottom: 20px;">${b.text}</h3>`;
    if (b.type === 'video') return `<div class="video-card" style="background: var(--mt-vbg); border: 2px solid var(${accentVar}); border-radius: 6px; padding: 24px; margin: 32px 0; display: flex; align-items: center; gap: 20px;">
      <span style="font-size: 30px;">🎥</span>
      <div style="flex: 1;">
        <p style="font-family: 'IBM Plex Sans'; font-weight: 700; font-size: 16px; margin-bottom: 6px;">${b.video.title}</p>
        <p style="font-family: 'IBM Plex Mono'; font-size: 12px; opacity: 0.6;">${b.video.channel} · ${b.video.duration}</p>
      </div>
      <a href="${b.video.url}" target="_blank" style="background: var(${accentVar}); color: var(${bgVar}); padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 4px; text-decoration: none;">Watch</a>
    </div>`;
    return '';
  }).join('');
}

function showTab(n) {
  tab = n;
  document.querySelectorAll('[id^=tab]').forEach((el, i) => {
    el.style.borderBottomColor = i === n ? 'var(--tab-active)' : 'transparent';
    el.style.color = i === n ? 'var(--tab-active)' : 'var(--tab-muted)';
    el.style.fontWeight = i === n ? '600' : '400';
  });
  document.getElementById('pageNum').textContent = `Page ${n + 1} of 4`;

  const content = document.getElementById('content');
  if (n === 0) content.innerHTML = renderTechNews();
  else if (n === 1) content.innerHTML = `<div class="content-container" style="background: var(--ph-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.physicsContent, '--ph-bg', '--ph-text', '--ph-accent', '--ph-fbg')}</div></div>`;
  else if (n === 2) content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.mathContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;
  else content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.deepContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;

  if (window.MathJax) {
    MathJax.typesetPromise([document.getElementById('content')]).catch(e => {});
  }
}

function nextTab() { if (tab < 3) showTab(tab + 1); }
function prevTab() { if (tab > 0) showTab(tab - 1); }

// Initialize on page load
loadSavedTheme();
showTab(0);
</script>
</body>
