<script>
const data = {"date":"June 21, 2026","dayOfWeek":"Sunday","articles":[{"category":"AI","cols":12,"title":"Nobel Laureate John Jumper Is Leaving DeepMind for Rival Anthropic","source":"TechCrunch","date":"Jun 20, 2026","summary":"John Jumper, the Nobel Prize-winning co-creator of AlphaFold who revolutionized protein structure prediction, is departing Google DeepMind to join rival Anthropic. Jumper, who shared the 2024 Nobel Prize in Chemistry with CEO Demis Hassabis, is not the only major departure — the move follows OpenAI poaching Transformer co-inventor Noam Shazeer from DeepMind in the same week, signaling an intensifying talent war between frontier AI labs as IPO-ready Anthropic and OpenAI bulk up ahead of public listings.","url":"https://techcrunch.com/2026/06/20/nobel-laureate-john-jumper-is-leaving-deepmind-for-rival-anthropic/"},{"category":"AI","cols":6,"title":"Signal's Meredith Whittaker: AI Chatbots 'Are Not Your Friends'","source":"TechCrunch","date":"Jun 20, 2026","summary":"Signal President Meredith Whittaker issued a stark warning about anthropomorphizing AI chatbots, arguing that treating language models as friends or confidants is a dangerous category error that companies deliberately encourage to increase user engagement. Whittaker, a longtime AI ethics advocate, pointed to the fundamental asymmetry: chatbots are corporate products optimized for retention, not relationships. Her comments land amid growing concern over AI companionship apps and emotional dependency on conversational agents.","url":"https://techcrunch.com/2026/06/20/signal-meredith-whittaker-ai-chatbots/"},{"category":"SECURITY","cols":6,"title":"From PGP to Mythos: A Brief History of Export Controls That Didn't Stop Anyone","source":"TechCrunch","date":"Jun 20, 2026","summary":"TechCrunch traces the history of US cryptography and AI export controls from the 1990s PGP 'munitions' classification through the recent White House order forcing Anthropic to cut foreign access to Mythos 5 and Fable 5 models. The analysis argues export controls on digital goods have a consistent track record of failure — code and model weights cross borders instantly, legal regimes move slowly, and restrictions primarily disadvantage American companies while foreign competitors fill the gap. The piece contextualizes the current Anthropic-White House standoff as the latest chapter in a decades-long pattern.","url":"https://techcrunch.com/2026/06/20/from-pgp-to-mythos-a-brief-history-of-export-controls-that-didnt-stop-anyone/"},{"category":"POLICY","cols":6,"title":"Bernie Sanders Unveils $7 Trillion Plan to Give Americans Control of AI Industry","source":"Ars Technica","date":"Jun 18, 2026","summary":"Senator Bernie Sanders proposed landmark legislation to create a sovereign wealth fund financed by a one-time 50% tax on stock of AI companies with over $200 million in annual AI revenue. The fund, estimated at $7 trillion, would pay annual dividends exceeding $1,000 per American while funding healthcare, education, and housing. The bill represents the most aggressive wealth redistribution proposal targeting the AI industry to date, though its legislative path through a divided Congress remains uncertain.","url":"https://arstechnica.com/tech-policy/2026/06/bernie-sanders-unveils-7-trillion-plan-to-give-americans-control-of-ai-industry/"},{"category":"POLICY","cols":6,"title":"UK Will Scan Asylum-Seekers' Faces for Age Checks Despite Knowing the Tech Is Flawed","source":"Ars Technica / WIRED","date":"Jun 20, 2026","summary":"The UK Home Office plans to deploy facial age estimation AI on asylum seekers at the border starting next year — the first known use of such technology in immigration enforcement. A WIRED/Lighthouse Reports investigation obtained internal UK government documents showing the systems regularly mistake children for adults and exhibit serious demographic bias. The deployment raises urgent questions about using AI for high-stakes biometric decisions, particularly given documented accuracy failures across skin tones and age ranges in the very populations being screened.","url":"https://arstechnica.com/tech-policy/2026/06/the-uk-will-scan-asylum-seekers-faces-for-age-checks-despite-knowing-the-tech-is-flawed/"},{"category":"AI","cols":6,"title":"The Professor of Outputmaxxing: Anjney Midha on Why GPU Count Isn't the Real AI Bottleneck","source":"Latent Space","date":"Jun 18, 2026","summary":"Anjney Midha — former Discord platform lead turned AMP compute grid founder and early backer of Anthropic, Mistral, and Black Forest Labs — argues the AI race's real bottleneck is not GPU access but utilization. Frontier lab xAI reportedly operates below 10% Model FLOPs Utilization (MFU), compared to 21% for GPT-3 and 60-70% best-in-class today. Midha's thesis: the next era of AI infrastructure must solve the 'thousand small decisions' — scheduling, networking, kernels, parallelism, and cluster reliability — that determine whether theoretical FLOPs become real training progress.","url":"https://www.latent.space/p/anj"},{"category":"ROBOTICS","cols":6,"title":"VLC Creator Jean-Baptiste Kempf Is Now Building Infrastructure for Robot Control","source":"TechCrunch","date":"Jun 19, 2026","summary":"Jean-Baptiste Kempf, the open-source legend who created VLC media player — used by billions — has founded Kyber, an infrastructure layer for controlling remote devices in real time. The French serial entrepreneur is building a protocol to standardize remote robot teleoperation, addressing the fragmentation in robotics control systems. The pivot from video streaming to robot control infrastructure reflects a broader trend of experienced systems engineers moving into the robotics stack as the industry transitions from lab demos to production deployment.","url":"https://techcrunch.com/2026/06/19/he-made-your-free-video-player-run-smoothly-now-hes-doing-that-for-robots/"},{"category":"NEWS","cols":4,"title":"Every New iOS 27 Feature Worth Knowing About","source":"TechCrunch","date":"Jun 20, 2026","summary":"Beyond the headline Siri AI and Apple Intelligence upgrades, iOS 27 brings substantive improvements: enhanced on-device ML processing, cross-app AI actions, and new developer APIs for integrating Apple Intelligence into third-party apps.","url":"https://techcrunch.com/2026/06/20/every-new-ios-27-feature-thats-worth-knowing-about/"},{"category":"SECURITY","cols":4,"title":"Microsoft Discovers Crypto Clipper: Self-Propagating Malware That Steals Cryptocurrency via USB","source":"Ars Technica","date":"Jun 18, 2026","summary":"Microsoft detected a new worm, Crypto Clipper, that spreads through USB drives, monitors clipboards for wallet addresses and seed phrases, and exfiltrates data through Tor. It doubles as a lightweight backdoor with remote code execution capability.","url":"https://arstechnica.com/security/2026/06/microsoft-spots-new-self-propagating-malware-for-stealing-cryptocurrency/"},{"category":"SECURITY","cols":4,"title":"Popa Botnet Linked to Publicly-Traded Israeli Firm Alarum Technologies","source":"Krebs on Security","date":"Jun 18, 2026","summary":"The sprawling Popa Android botnet, which has forced millions of consumer TV boxes into ad fraud and data-scraping relay networks over four years, has been traced to NetNut, a residential proxy service operated by NASDAQ-listed Alarum Technologies.","url":"https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"},{"category":"HARDWARE","cols":4,"title":"As China Looms, Taiwan Ramps Drone Production for Defense and US Military Sales","source":"Ars Technica","date":"Jun 18, 2026","summary":"Taiwan proposed a $6.6 billion six-year budget for over 208,000 domestically made attack drones plus reconnaissance drones and uncrewed surface vessels. Taiwanese companies are also partnering to sell military drones to the US and allied buyers.","url":"https://arstechnica.com/ai/2026/06/as-china-looms-taiwan-makes-more-drones-for-defense-and-the-us-military/"},{"category":"NEWS","cols":4,"title":"Before SpaceX IPO, Investors with Chinese Military Ties Secretly Acquired Stakes","source":"Ars Technica / ProPublica","date":"Jun 18, 2026","summary":"A ProPublica investigation revealed that a businessman tied to Chinese military contractors and a Qatari royal-linked entity acquired SpaceX stakes while it was private, raising national security concerns about foreign investment in the $1.8T-valued space and defense contractor ahead of its historic IPO.","url":"https://arstechnica.com/information-technology/2026/06/before-spacex-ipo-investors-in-china-secretly-acquired-stakes/"},{"category":"NEWS","cols":4,"title":"FDA Advisors Unanimously Vote to Approve Moderna's mRNA Flu Vaccine","source":"Ars Technica","date":"Jun 18, 2026","summary":"The FDA's advisory committee voted 9-0 to recommend Moderna's mRNA-1010 seasonal flu vaccine after a Trump appointee initially tried to block review. Phase 3 trial data showed 27% greater effectiveness than standard flu shots in adults over 50.","url":"https://arstechnica.com/health/2026/06/fda-advisors-unanimously-vote-to-approve-modernas-mrna-after-agency-drama/"},{"category":"AI","cols":4,"title":"IEEE Launches Large Language Models Virtual Training Course for Engineers","source":"IEEE Spectrum","date":"Jun 19, 2026","summary":"IEEE rolled out a new virtual training program on LLMs targeting practicing engineers, covering transformer architecture fundamentals, implementation patterns, and security considerations. The course acknowledges LLMs' shift from research curiosities to core architectural elements in mainstream engineering.","url":"https://spectrum.ieee.org/large-language-models-ieee-course"},{"category":"ROBOTICS","cols":4,"title":"What Amazon's Astro Taught About Giving Robots a Soul","source":"IEEE Spectrum","date":"Jun 19, 2026","summary":"Amazon's former lead UX Sound Designer for Astro reveals how the team learned that users instinctively anthropomorphize mobile robots — treating them as characters, not appliances. The insight shaped Astro's identity independent of Alexa, with implications for the entire consumer robotics field as humanoid and home robots proliferate.","url":"https://spectrum.ieee.org/amazon-astro-robot-sound"},{"category":"STARTUPS","cols":4,"title":"YC Demo Day: 11 Standout Startups According to VCs","source":"TechCrunch","date":"Jun 18, 2026","summary":"VCs identified 11 breakout companies from Y Combinator's Spring 2026 batch, some commanding valuations over $175 million. The batch reflects a heavy tilt toward AI infrastructure, developer tools, and vertical AI applications.","url":"https://techcrunch.com/2026/06/18/the-11-standout-startups-from-ycs-demo-day-according-to-vcs/"},{"category":"AI","cols":4,"title":"In the Weights: A New Vanity Search Engine for the AI Era","source":"TechCrunch","date":"Jun 20, 2026","summary":"A new service called 'In the Weights' lets users search for their own name or brand across AI training data and model outputs, addressing growing demand for transparency about personal information embedded in LLM training corpora.","url":"https://techcrunch.com/2026/06/20/in-the-weights-ai-vanity-search/"},{"category":"STARTUPS","cols":4,"title":"Founders Fund Makes Outlier Bet on Robotics Startup for Humane Fish Harvesting","source":"TechCrunch","date":"Jun 20, 2026","summary":"Peter Thiel's Founders Fund invested in a robotics startup developing autonomous systems for humane fish harvesting — an unusual bet that combines underwater robotics, computer vision, and aquaculture sustainability in a sector traditionally overlooked by Silicon Valley VCs.","url":"https://techcrunch.com/2026/06/20/founders-fund-outlier-bet-humane-fish-robotics/"},{"category":"AI","cols":4,"title":"MCP's Real Value: Isolating Auth Flow Outside the Agent's Context Window","source":"Simon Willison's Blog","date":"Jun 19, 2026","summary":"In a widely discussed Hacker News comment, Sean Lynch argued that the Model Context Protocol's core value isn't tool execution but isolating authentication flows outside the agent's context window — suggesting MCP's idealized form may simply be an auth gateway for APIs.","url":"https://simonwillison.net/2026/Jun/19/sean-lynch/"}],"physicsContent":[{"type":"section_heading","text":"RELATIVITY"},{"type":"heading","text":"Gravitational Time Dilation: Why Your Head Ages Faster Than Your Feet"},{"type":"paragraph","text":"Einstein's general theory of relativity (1915) made a prediction so counterintuitive that it took decades to verify experimentally: time runs slower in stronger gravitational fields. This is gravitational time dilation — a direct consequence of the curvature of spacetime by mass-energy. The deeper you are in a gravitational well, the slower your clock ticks relative to an observer farther out. For a human standing on Earth, the effect means your head ages roughly 10⁻¹⁶ seconds more per year than your feet — an infinitesimal but real difference that GPS satellites must correct for daily."},{"type":"subheading","text":"The Schwarzschild Metric"},{"type":"paragraph","text":"The starting point for understanding gravitational time dilation is the Schwarzschild metric, the exact solution to Einstein's field equations for a non-rotating, spherically symmetric mass:"},{"type":"formula","text":"\\[ ds^2 = -\\left(1 - \\frac{2GM}{c^2 r}\\right) c^2 dt^2 + \\left(1 - \\frac{2GM}{c^2 r}\\right)^{-1} dr^2 + r^2(d\\theta^2 + \\sin^2\\theta\\, d\\phi^2) \\]"},{"type":"paragraph","text":"For a stationary observer at radial coordinate \\(r\\), the relationship between proper time \\(\\tau\\) (the time measured by a clock at that location) and coordinate time \\(t\\) (the time measured by a distant observer far from the mass) is:"},{"type":"formula","text":"\\[ d\\tau = \\sqrt{1 - \\frac{2GM}{c^2 r}}\\, dt = \\sqrt{1 - \\frac{r_s}{r}}\\, dt \\]"},{"type":"paragraph","text":"Here \\(r_s = 2GM/c^2\\) is the Schwarzschild radius — the radius at which the time dilation factor goes to zero (the event horizon of a black hole). For Earth, \\(r_s \\approx 8.87 \\text{ mm}\\), while Earth's radius is roughly \\(6.37 \\times 10^6 \\text{ m}\\). The small ratio \\(r_s / r \\approx 1.39 \\times 10^{-9}\\) explains why the effect is tiny at Earth's surface."},{"type":"subheading","text":"The GPS Correction"},{"type":"paragraph","text":"GPS satellites orbit at approximately 20,200 km altitude (\\(r \\approx 2.66 \\times 10^7 \\text{ m}\\) from Earth's center). At this altitude, gravitational time dilation makes satellite clocks run faster by about 45 microseconds per day relative to ground clocks. Simultaneously, special relativistic time dilation from orbital velocity (\\(v \\approx 3.9 \\text{ km/s}\\)) makes them run slower by about 7 microseconds per day. The net effect is +38 microseconds per day — which, uncorrected, would cause GPS position errors accumulating at roughly 11 km per day. The system deliberately offsets satellite clock frequencies to compensate before launch: 10.22999999543 MHz instead of the nominal 10.23 MHz."},{"type":"heading","text":"Why This Matters for an ML/AI Engineer"},{"type":"paragraph","text":"Gravitational time dilation is more than a physics curiosity — it is an existence proof that reference frames are not interchangeable and that local measurements depend on the global geometry of spacetime. This has deep structural parallels to problems in ML: distribution shift, where model performance changes because the deployment environment differs from training; covariance in learned representations, where coordinate choices affect what a model can express; and the general lesson that any measurement — whether a clock reading or a classifier's confidence score — is a function of both the object being measured and the measurement apparatus. Just as you cannot define 'simultaneity' across gravitational potentials without specifying a coordinate system, you cannot define 'accuracy' across distributions without specifying the evaluation manifold. The geometry matters."},{"type":"heading","text":"Recent Research Connection"},{"type":"paragraph","text":"In 2025-2026, optical lattice clocks have achieved fractional frequency uncertainties below 10⁻¹⁸, making them sensitive enough to detect gravitational time dilation over height differences of mere millimeters. A 2026 experiment at JILA demonstrated relativistic geodesy — using portable optical clocks to map Earth's gravitational potential with centimeter-level precision. This has direct applications in climate science (monitoring ice sheet mass loss through gravitational change), hydrology, and geodesy. The clocks are also being investigated as dark matter detectors: if dark matter couples weakly to standard model fields, it would cause tiny periodic shifts in atomic transition frequencies as Earth moves through dark matter halos. The precision required — parts in 10⁻¹⁹ or better — pushes the frontier of both quantum metrology and signal processing, areas where ML-based noise reduction and anomaly detection are increasingly central."}],"mathContent":[{"type":"section_heading","text":"MATHEMATICS"},{"type":"heading","text":"The Mandelbrot Set: Infinite Complexity from \\(z \\mapsto z^2 + c\\)"},{"type":"paragraph","text":"The Mandelbrot set is arguably the most famous object in mathematics — a fractal that encodes infinite complexity in an equation simple enough to fit on a t-shirt. Discovered by Benoit Mandelbrot in 1980 while working at IBM, it emerges from iterating the complex quadratic map: pick a complex number \\(c\\), start with \\(z_0 = 0\\), and repeatedly compute \\(z_{n+1} = z_n^2 + c\\). If the sequence remains bounded (does not escape to infinity), then \\(c\\) belongs to the Mandelbrot set. The boundary of the set — where bounded and unbounded behavior meet — is a fractal of infinite detail, containing miniature copies of itself at every scale."},{"type":"subheading","text":"The Escape-Time Algorithm"},{"type":"paragraph","text":"To determine membership, we use the escape-time criterion: if \\(|z_n| > 2\\) for any \\(n\\), the orbit will diverge to infinity. The number of iterations before escape determines the coloring in the classic Mandelbrot visualizations. Formally:"},{"type":"formula","text":"\\[ \\mathcal{M} = \\{c \\in \\mathbb{C} : \\sup_{n \\in \\mathbb{N}} |z_n| < \\infty \\text{ where } z_0 = 0, z_{n+1} = z_n^2 + c\\} \\]"},{"type":"paragraph","text":"The proof that \\(|z_n| > 2\\) guarantees escape uses the triangle inequality. If \\(|z| > 2\\) and \\(|z| \\geq |c|\\), then \\(|z^2 + c| \\geq |z|^2 - |c| \\geq |z|^2 - |z| = |z|(|z| - 1) > |z|\\). The orbit grows monotonically and diverges. Conversely, if \\(|c| \\leq 2\\) and the orbit never exceeds 2, it is trapped in the disk of radius 2 forever — hence bounded. This simple bound makes the algorithm computable: iterate up to some maximum depth, and if the orbit stays within radius 2, declare \\(c\\) (likely) in the set."},{"type":"subheading","text":"Connection to the Logistic Map and Universality"},{"type":"paragraph","text":"The Mandelbrot set is not just a pretty picture — it is a universal object. Along the real axis (where \\(c\\) is real), the iteration \\(x_{n+1} = x_n^2 + c\\) is conjugate to the logistic map \\(x_{n+1} = r x_n (1 - x_n)\\) via a linear change of variables. The period-doubling cascade that leads to chaos in the logistic map corresponds to the sequence of bifurcations along the Mandelbrot set's main antenna. Feigenbaum's constants \\(\\delta \\approx 4.669\\) and \\(\\alpha \\approx 2.503\\), which govern the scaling of period-doubling in a vast class of dynamical systems, were first discovered numerically in the Mandelbrot set's boundary structure. This universality — that qualitatively different systems exhibit identical quantitative scaling — is one of the deepest discoveries in nonlinear dynamics."},{"type":"heading","text":"Why It Matters"},{"type":"paragraph","text":"The Mandelbrot set demonstrates a principle that resonates deeply with ML: simple rules can generate unbounded complexity. A two-parameter family of quadratic maps produces a structure whose boundary has Hausdorff dimension 2 (it is so convoluted it essentially fills a plane), whose area is finite but whose perimeter is infinite, and which contains deep structural regularities (the Feigenbaum universality) that transcend the specific equation. This is the geometric analog of emergent behavior in large models — complex capabilities arising from simple training objectives — and a permanent reminder that understanding the generating process does not imply being able to predict its output without actually running it. Some systems are computationally irreducible, and the Mandelbrot set is the canonical example."},{"type":"video","video":{"title":"The Mandelbrot Set: How a Simple Equation Generates Infinite Complexity","channel":"3Blue1Brown","duration":"26:04","url":"https://www.youtube.com/watch?v=FFftmWSzgmk"}}],"deepContent":[{"type":"section_heading","text":"DEEP DIVE: ROBOTICS & EMBODIED AI"},{"type":"heading","text":"The Robotics Stack Is Finally Coming Together — And It Looks Like the Internet Stack Circa 1995"},{"type":"paragraph","text":"This week brought three robotics stories that, together, signal an inflection point. Jean-Baptiste Kempf — the creator of VLC, the media player running on billions of devices — is now building Kyber, an infrastructure layer for real-time robot teleoperation. Amazon's Astro designers published a retrospective on the lesson they learned too late: users instinctively treat mobile robots as characters, not appliances, and failing to design for that reality makes products feel 'creepy.' Founders Fund placed a bet on a startup using underwater robotics for humane fish harvesting — the kind of unglamorous, domain-specific automation that Silicon Valley has historically ignored. These are not isolated data points. They are symptoms of a robotics industry transitioning from a hardware-first, vertically integrated model to a software-and-infrastructure-first, horizontally layered model."},{"type":"subheading","text":"The Horizontalization Thesis"},{"type":"paragraph","text":"Every major technology platform in history has followed the same arc: initial vertical integration (one company builds the whole stack), followed by horizontal specialization (different companies build different layers, connected by standard interfaces). The PC industry went through this in the 1980s when Microsoft abstracted the OS from IBM's hardware. The internet went through it in the 1990s when TCP/IP separated applications from physical networks. Cloud computing did it in the 2010s when AWS decoupled compute from physical servers. Robotics is doing it now. Kempf's Kyber is effectively building the 'TCP/IP for robots' — a standard protocol for controlling remote devices in real time. If it succeeds, robot hardware becomes a commodity peripheral to a software control plane, just as printers became commodities once PostScript standardized the print stack."},{"type":"heading","text":"Why Foundation Models Change the Robotics Equation"},{"type":"paragraph","text":"The missing piece in robotics for decades was perception and planning — the ability to understand unstructured environments and generate appropriate motor commands. Traditional robotics used hand-engineered perception pipelines (SLAM, object detection, trajectory optimization) that were brittle and domain-specific. Large vision-language-action (VLA) models like Google's RT-2 and the open-source OpenVLA changed this: a single model can now take camera input and natural language instructions and produce robot actions across diverse embodiments and environments. The key insight is that pre-training on internet-scale vision and language data produces representations that transfer to physical interaction. The gap between 'seeing a cup on a table' in a YouTube video and 'seeing a cup on a table' through a robot's camera is smaller than the robotics community believed. Foundation models collapse the perception-planning-action pipeline into a single learned mapping, and as these models improve — driven by the same scaling laws that produced GPT-5 and Claude — the software layer of robotics becomes increasingly commoditized."},{"type":"formula","text":"\\[ \\text{Robot Action} = \\text{VLA}(\\text{Camera Image}, \\text{Task Description}, \\text{Proprioception}) \\]"},{"type":"subheading","text":"The Hardware Remains Hard"},{"type":"paragraph","text":"This does not mean robotics is solved. The Astro lesson — that embodiment creates expectations the software must satisfy — generalizes: a robot is not a chatbot with wheels. Physical interaction introduces constraints that pure software systems never face. Actuator latency, power budgets, safety-critical failure modes, sensor fusion under adversarial physical conditions (glare, occlusion, vibration), and the irreducible complexity of contact mechanics mean the hardware layer is not commoditizing at anywhere near the same rate as the software layer. This is precisely why Kempf's Kyber is building infrastructure rather than another robot — the value is migrating to the control plane. Founders Fund's fish-harvesting bet makes sense through this lens: the hard part is the specific physical manipulation (grasping, cutting, handling biological variation), and whoever solves that for one domain captures the domain. The general-purpose robot remains a distant goal; domain-specific automation with general-purpose perception is the near-term play."},{"type":"heading","text":"Position: The Next 24 Months"},{"type":"paragraph","text":"The robotics industry is entering a phase structurally analogous to the web browser wars of 1995-2000. Multiple well-funded players (Figure, Tesla Optimus, 1X, Agility Robotics, Boston Dynamics/Hyundai, Genesis AI) are building humanoid hardware, while a parallel ecosystem of perception models, control protocols, and simulation environments is forming around them. The winners will not necessarily be the companies with the best hardware — they will be the companies that capture the interface layer where developers build applications. This is the Kyber thesis, and it is the right bet. For an ML engineer entering the field today, the highest-leverage contributions are in: (1) sim-to-real transfer — closing the gap between policies trained in simulation and deployed on hardware, which remains the dominant bottleneck; (2) multi-modal foundation models for manipulation — extending VLA architectures to handle force feedback, tactile sensing, and long-horizon tasks; and (3) safety verification — formal methods and runtime monitoring for learned policies operating in human environments. The software stack is still being built. The window to define it is open."},{"type":"subheading","text":"Connecting to This Week's News"},{"type":"paragraph","text":"The John Jumper move to Anthropic is obliquely relevant here. Jumper's AlphaFold solved a problem — protein structure prediction — that was considered a 'grand challenge' for 50 years, using deep learning applied to a domain (biology) far from the model's training distribution. The same pattern — applying general-purpose neural architectures to specific physical domains — is the core thesis of modern robotics. Anthropic's Constitutional AI approach to alignment may prove especially relevant for robots operating in human environments, where the constraint space is not just 'don't say harmful things' but 'don't apply 200N of force to a human limb.' The convergence of frontier AI talent (Jumper), infrastructure builders (Kempf), and domain-specific capital (Founders Fund) into robotics suggests the sector is approaching its Netscape moment — the point where infrastructure, capital, and talent simultaneously reach critical mass for an explosion of applications."}]};
let tab = 0;

// Theme switching functionality
function setTheme(themeName) {
  const root = document.getElementById('root');
  root.setAttribute('data-theme', themeName);

  // Update active state on theme dots
  document.querySelectorAll('.theme-dot').forEach(dot => {
    if (dot.getAttribute('data-theme') === themeName) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });

  // Persist theme preference to localStorage
  try {
    localStorage.setItem('digest-theme', themeName);
  } catch(e) {
    console.error('Failed to save theme preference:', e);
  }
}

// Load saved theme on page load
function loadSavedTheme() {
  try {
    const savedTheme = localStorage.getItem('digest-theme');
    if (savedTheme && ['parchment', 'sepia', 'nordic', 'dusk', 'graphite'].includes(savedTheme)) {
      setTheme(savedTheme);
    } else {
      setTheme('parchment');
    }
  } catch(e) {
    console.error('Failed to load theme preference:', e);
    setTheme('parchment');
  }
}

function renderTechNews() {
  return `<div class="tech-news-container" style="background: var(--tn-bg); padding: 48px 24px 80px; min-height: 100%;">
    <h1 style="font-family: Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; color: var(--tn-accent); border-bottom: 4px solid var(--tn-accent); padding-bottom: 24px; margin-bottom: 48px;">Tech News — ${data.date}</h1>
    <div id="tech-grid" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;">
      ${data.articles.map(a => `<div style="grid-column: span ${a.cols}; background: var(--tn-card); border: 2px solid var(--tn-border); padding: 24px;">
        <span style="display: inline-block; background: var(--tn-accent); color: var(--tn-bg); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 10px; margin-bottom: 16px; font-family: 'IBM Plex Mono'; text-transform: uppercase;">${a.category}</span>
        <h2 class="${a.cols === 12 ? 'article-title-large' : 'article-title-small'}" style="font-family: Georgia, serif; font-size: ${a.cols === 12 ? '36px' : '20px'}; font-weight: 700; color: var(--tn-ink); line-height: 1.12; margin-bottom: ${a.cols === 12 ? '20px' : '12px'};">${a.title}</h2>
        <p style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--tn-meta); margin-bottom: 14px;">${a.source} · ${a.date}</p>
        <p class="article-summary" style="font-family: 'IBM Plex Sans'; font-size: ${a.cols === 12 ? '16px' : '14px'}; line-height: 1.65; color: var(--tn-ink); opacity: 0.78;">${a.summary}</p>
        <a href="${a.url}" target="_blank" style="display: inline-block; font-size: 12px; font-weight: 600; color: var(--tn-accent); border-bottom: 1.5px solid var(--tn-accent); margin-top: 20px; text-decoration: none;">Read Full Article →</a>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderContent(blocks, bgVar, textVar, accentVar, fbgVar) {
  return blocks.map(b => {
    if (b.type === 'section_heading') return `<p style="font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(${accentVar}); opacity: 0.65; margin-bottom: 16px;">${b.text}</p>`;
    if (b.type === 'heading') return `<h2 class="content-heading" style="font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(${accentVar}); margin-bottom: 24px;">${b.text}</h2>`;
    if (b.type === 'paragraph') return `<p class="content-paragraph" style="font-family: Georgia, serif; font-size: 18px; line-height: 1.8; color: var(${textVar}); text-align: justify; margin-bottom: 20px;">${b.text}</p>`;
    if (b.type === 'formula') return `<div class="formula-block" style="padding: 28px 20px; margin: 32px 0; text-align: center; border-left: 3px solid var(${accentVar}); background: var(${fbgVar}); color: var(${textVar});">${b.text}</div>`;
    if (b.type === 'subheading') return `<h3 class="content-subheading" style="font-family: Georgia, serif; font-size: 22px; font-weight: 600; color: var(${textVar}); margin-top: 44px; margin-bottom: 20px;">${b.text}</h3>`;
    if (b.type === 'video') return `<div class="video-card" style="background: var(--mt-vbg); border: 2px solid var(${accentVar}); border-radius: 6px; padding: 24px; margin: 32px 0; display: flex; align-items: center; gap: 20px;">
      <span style="font-size: 30px;">🎥</span>
      <div style="flex: 1;">
        <p style="font-family: 'IBM Plex Sans'; font-weight: 700; font-size: 16px; margin-bottom: 6px;">${b.video.title}</p>
        <p style="font-family: 'IBM Plex Mono'; font-size: 12px; opacity: 0.6;">${b.video.channel} · ${b.video.duration}</p>
      </div>
      <a href="${b.video.url}" target="_blank" style="background: var(${accentVar}); color: var(${bgVar}); padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 4px; text-decoration: none;">Watch</a>
    </div>`;
    return '';
  }).join('');
}

function showTab(n) {
  tab = n;
  document.querySelectorAll('[id^=tab]').forEach((el, i) => {
    el.style.borderBottomColor = i === n ? 'var(--tab-active)' : 'transparent';
    el.style.color = i === n ? 'var(--tab-active)' : 'var(--tab-muted)';
    el.style.fontWeight = i === n ? '600' : '400';
  });
  document.getElementById('pageNum').textContent = `Page ${n + 1} of 4`;

  const content = document.getElementById('content');
  if (n === 0) content.innerHTML = renderTechNews();
  else if (n === 1) content.innerHTML = `<div class="content-container" style="background: var(--ph-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.physicsContent, '--ph-bg', '--ph-text', '--ph-accent', '--ph-fbg')}</div></div>`;
  else if (n === 2) content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.mathContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;
  else content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.deepContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;

  if (window.MathJax) {
    MathJax.typesetPromise([document.getElementById('content')]).catch(e => {});
  }
}

function nextTab() { if (tab < 3) showTab(tab + 1); }
function prevTab() { if (tab > 0) showTab(tab - 1); }

// Initialize on page load
loadSavedTheme();
showTab(0);
</script>
</body>
</html>
