<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nishant's Daily Digest</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'IBM Plex Sans', 'Inter', system-ui, -apple-system, sans-serif;
  background: #0A0A0A;
  color: #FFFFFF;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 80px 24px 60px;
}

.header {
  text-align: center;
  margin-bottom: 48px;
}

.header h1 {
  font-family: 'IBM Plex Mono', 'SF Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 12px;
  color: rgba(255,255,255,0.5);
}

.header p {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.2;
  color: #FFFFFF;
}

.digest-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.digest-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  text-decoration: none;
  transition: all 200ms ease;
  cursor: pointer;
}

.digest-card:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.16);
  transform: translateX(4px);
}

.card-date {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 16px;
  font-weight: 500;
  color: #FFFFFF;
  flex: 1;
}

.card-day {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.card-arrow {
  font-size: 16px;
  color: rgba(255,255,255,0.2);
  transition: all 200ms ease;
}

.digest-card:hover .card-arrow {
  color: rgba(255,255,255,0.6);
  transform: translateX(2px);
}

.footer {
  text-align: center;
  margin-top: 48px;
}

.footer a {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  transition: color 200ms ease;
}

.footer a:hover {
  color: rgba(255,255,255,0.6);
}

@media (max-width: 480px) {
  .container { padding: 48px 16px 40px; }
  .header p { font-size: 28px; }
  .digest-card { padding: 16px 20px; }
  .card-date { font-size: 15px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Index</h1>
    <p>Nishant's Daily Digest</p>
  </header>
  <div class="digest-list">
    <a href="./2026-06-10/" class="digest-card">
      <span class="card-date">June 10, 2026</span>
      <span class="card-day">Wednesday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-11/" class="digest-card">
      <span class="card-date">June 11, 2026</span>
      <span class="card-day">Thursday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-12/" class="digest-card">
      <span class="card-date">June 12, 2026</span>
      <span class="card-day">Friday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-13/" class="digest-card">
      <span class="card-date">June 13, 2026</span>
      <span class="card-day">Saturday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-14/" class="digest-card">
      <span class="card-date">June 14, 2026</span>
      <span class="card-day">Sunday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-15/" class="digest-card">
      <span class="card-date">June 15, 2026</span>
      <span class="card-day">Monday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-16/" class="digest-card">
      <span class="card-date">June 16, 2026</span>
      <span class="card-day">Tuesday</span>
      <span class="card-arrow">→</span>
    </a>
    <a href="./2026-06-17/" class="digest-card">
      <span class="card-date">June 17, 2026</span>
      <span class="card-day">Wednesday</span>
      <span class="card-arrow">→</span>
    </a>
  </div>
  <footer class="footer">
    <a href="https://github.com/daddyankee/nishant-digest" target="_blank">Source on GitHub</a>
  </footer>
</div>
</body>
</html>
