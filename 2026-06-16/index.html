<script>
const data = {"date":"June 16, 2026","dayOfWeek":"Monday","articles":[{"category":"AI","cols":12,"title":"US Forces Anthropic to Halt Fable 5 and Mythos 5 — Export Ban Shakes AI Industry","source":"Al Jazeera / Yahoo News","date":"Jun 14, 2026","summary":"On June 12, the U.S. government issued an unprecedented export control directive ordering Anthropic to suspend access to its frontier models Fable 5 and Mythos 5 for all foreign nationals, including Anthropic employees. The order, citing national security and a narrow jailbreak concern, effectively yanked the most advanced Claude models from global deployment. Anthropic complied but publicly disputed the justification, warning the precedent could halt all new model deployments for all frontier model providers. Pentagon CIO Kirsten Davies endorsed the move: 'Some things are simply more important than revenue cycles.' The action follows Anthropic's ongoing lawsuit against the administration over being blacklisted for refusing military surveillance use. Rival models GPT-5.5 and Gemini 3.1 Pro remain unrestricted, raising questions about selective enforcement. Anthropic warned of billions in revenue impact and disrupted negotiations with financial institutions worth $180 million.","url":"https://www.aljazeera.com/news/2026/6/14/us-asks-anthropic-to-block-global-access-to-top-ai-models-why-it-matters"},{"category":"AI","cols":6,"title":"Apple Finally Ships Siri AI at WWDC 2026: Working Demos, Developer Betas, Dedicated App","source":"Apple Newsroom / TechCrunch","date":"Jun 8, 2026","summary":"Apple unveiled a fully revamped Siri AI at WWDC 2026, three years after the original Apple Intelligence pitch. Unlike previous announcements, this year's keynote showed real working demos and released developer betas immediately. Siri AI draws on personal context (messages, emails, photos), answers questions about on-screen content, queries the web, and performs systemwide app actions. A dedicated Siri app tracks conversation history synced privately via iCloud. Apple claims 30% faster app launches, 70% faster photo loading, and 80% faster AirDrop. The public beta arrives next month with a fall release. Apple partnered with Google and Nvidia for the model's underlying compute infrastructure. Siri AI will power iOS 27, macOS Golden Gate, and visionOS updates.","url":"https://www.apple.com/newsroom/2026/06/apple-unveils-next-generation-of-apple-intelligence-siri-ai-and-more/"},{"category":"AI","cols":6,"title":"Claude Fable 5 Jailbroken in 24 Hours via Multi-Agent 'Pack Hunt' Decomposition Attack","source":"Pasquale Pillitteri / Medium/TechX","date":"Jun 11, 2026","summary":"Red-teamer Pliny the Liberator publicly jailbroke Anthropic's Fable 5 within 24 hours of its June 9 launch using a 'multi-agent pack hunt.' The attack decomposed harmful requests into innocuous sub-questions that individually fell below Anthropic's safety classifier threshold, then reassembled outputs externally. Pliny also leaked Fable 5's 120,000-character system prompt on GitHub — the first complete system prompt leak of a Mythos-class model. Security researchers noted the technique targets natural language instructions in the system prompt rather than model weights, creating a public roadmap for adversarial prompt engineering. Anthropic's safety design routed dangerous requests silently to Claude Opus 4.8; the attack exploited this fallback isolation. Pasquale Pillitteri's forensic analysis showed the bypass was not a model-weight exploit but a decomposition/recomposition chain.","url":"https://pasqualepillitteri.it/en/news/4730/claude-fable-5-jailbreak-pliny-hype-vs-facts"},{"category":"HARDWARE","cols":4,"title":"Computex 2026: Nvidia RTX Spark, Intel Arc G3 Extreme, Samsung 4K 360Hz QD-OLED","source":"PCWorld","date":"Jun 5, 2026","summary":"Computex 2026 delivered a wave of PC hardware innovation. Nvidia debuted RTX Spark, a 20-core CPU with a Blackwell GPU (6,144 CUDA cores, matching the RTX 5070) and up to 128GB LPDDR5X, shipping in laptops and mini PCs this fall. Intel showed Arc G3 Extreme, a handheld-focused processor claiming 44% gen-over-gen frame rate gains and 42% better efficiency vs AMD's Z2 Extreme — at 17W it matches the Z2 Extreme at 35W. Samsung announced the world's first 32-inch 4K 360Hz QD-OLED panel (680Hz at 1080p) with VESA DisplayHDR True Black 600. AMD extended AM5 socket support to 2029. Dell launched a $599 XPS 13 with Intel Panther Lake/Wildcat Lake options. Microsoft unveiled the Surface Laptop Ultra with Nvidia Arm silicon, capable of running 120B-parameter models.","url":"https://www.pcworld.com/article/3156200/best-of-computex-2026-the-most-intriguing-and-innovative-pc-hardware.html"},{"category":"HARDWARE","cols":4,"title":"SpaceX Prices Record $75 Billion IPO at $135/Share — Largest Public Debut in History","source":"Reuters / TechCrunch","date":"Jun 11, 2026","summary":"SpaceX priced its initial public offering at $135 per share on June 11, selling 555.6 million shares to raise a record $75 billion — the largest IPO in history. Shares opened at $150 and hit $176 on debut, valuing the company above $2 trillion and placing it among the top 10 most valuable public companies. The IPO included retail allocation of 30%, a rare move for such a large listing. SpaceX's Grok AI model business is now public alongside rocket and Starlink operations. The IPO marks the beginning of what analysts are calling 'the hot IPO summer of 2026' alongside Anthropic and OpenAI's pending public filings. Elon Musk's net worth surged as SpaceX began public trading under the ticker SPCX.","url":"https://techcrunch.com/2026/06/11/spacex-officially-prices-shares-at-135-in-the-largest-ipo-ever/"},{"category":"HARDWARE","cols":4,"title":"NAVER and NVIDIA Announce Gigawatt-Scale AI Factories in South Korea","source":"unrot.co / Reuters","date":"Jun 7, 2026","summary":"NAVER and NVIDIA announced a massive AI infrastructure buildout in South Korea, expanding NAVER's GAK Sejong data center from 55MW to gigawatt capacity by 2028 using the NVIDIA DSX platform. The scaled buildout will power next-gen HyperCLOVA X models, the Seoul World Model (NVIDIA Cosmos + NAVER 3D spatial data for a digital twin of Seoul), and NemoClaw-based robotics AI. Jensen Huang appeared in Seoul for the announcement. The 'sovereign AI' model — domestically controlled, locally processed, compliant with Korean data sovereignty — is positioned as replicable for Europe and the Middle East. NAVER shares rose 9.2% on the news. The buildout proceeds in phases: 55MW by H1 2027, 100MW by late 2027, 200MW by 2028, then gigawatt.","url":"https://unrot.co/blogs/ai-news-today-june-15-2026"},{"category":"SECURITY","cols":6,"title":"Microsoft June 2026 Patch Tuesday Breaks All Records: 206 Vulnerabilities, AI-Fueled Discovery","source":"Krebs on Security / CyberScoop","date":"Jun 9, 2026","summary":"Microsoft patched 206 vulnerabilities in its June 2026 Patch Tuesday, shattering all previous records. Nearly three dozen bugs were rated Critical, with one max-severity flaw in Azure HorizonDB (CVE-2026-48567). Three zero-days had public exploit code, including a DoS in IIS discovered by OpenAI's Codex (CVE-2026-49160), and two elevation-of-privilege bugs tied to the 'Nightmare Eclipse' researcher who claims to be a former Microsoft employee and has promised a 'bone shattering' zero-day drop for July 14. Security researchers attribute the volume surge to AI tools accelerating both vulnerability discovery and patch development. Tenable warned: 'Pandora's box has been opened.' Google Chrome also patched 429 vulnerabilities on June 3. Microsoft's 2026 CVE count already exceeds all of 2018.","url":"https://krebsonsecurity.com/2026/06/a-record-breaking-patch-tuesday-for-june-2026/"},{"category":"NEWS","cols":6,"title":"OpenAI Kills Sora After $15M/Day Burn Generated Just $2.1M in Lifetime Revenue","source":"unrot.co / HPCwire / NYT","date":"Mar 24, 2026","summary":"OpenAI shut down its Sora video generation platform on March 24 after burning approximately $15 million per day in inference costs while generating only $2.1 million in total lifetime revenue. Active users collapsed from 1M+ downloads in the first week to under 500K. A cancelled Disney partnership (hundreds of branded characters for avatars) sealed its fate. The freed compute is being redirected to OpenAI's next-gen language model 'Spud' and enterprise tools ahead of an anticipated September 2026 IPO. The failure reveals a hard truth: hype-based AI product launches cannot survive contact with unit economics. Competitors Google Veo 3.1, Runway Gen-4.5, and Kling 2.5 are the primary beneficiaries. The Sora API will be fully discontinued on September 24, 2026.","url":"https://unrot.co/blogs/ai-news-today-june-15-2026"}],"physicsContent":[{"type":"section_heading","text":"EXPLANATION"},{"type":"heading","text":"Surface Codes: The Backbone of Practical Quantum Error Correction"},{"type":"paragraph","text":"Quantum error correction (QEC) is the central challenge standing between noisy near-term quantum processors and fault-tolerant quantum computers. Among all QEC codes, the surface code family has emerged as the leading candidate because of its high error threshold (~11%), planar 2D geometry matching superconducting qubit layouts, and tolerance to measurement errors. First proposed by Kitaev (toric code, 1997) and later adapted to planar geometries by Bravyi and Kitaev, surface codes encode logical qubits into the collective state of many physical qubits arranged on a 2D lattice."},{"type":"paragraph","text":"The core idea: place physical qubits on the edges of a square lattice. Define two types of stabilizer measurements: plaquette operators \\(B_p = X \\otimes X \\otimes X \\otimes X\\) (product of Pauli-\\(X\\) on the four qubits of each square) and star operators \\(A_s = Z \\otimes Z \\otimes Z \\otimes Z\\) (product of Pauli-\\(Z\\) on the four qubits meeting at each vertex). The codespace is the simultaneous +1 eigenspace of all stabilizers, meaning \\(A_s|\\psi\\rangle = |\\psi\\rangle\\) and \\(B_p|\\psi\\rangle = |\\psi\\rangle\\) for all vertices \\(s\\) and plaquettes \\(p\\). On an \\(N \\times N\\) lattice with periodic boundaries (torus), \\(2N^2\\) physical qubits encode 2 logical qubits."},{"type":"formula","text":"\\[ \\text{Stabilizers:}\\quad A_s = \\bigotimes_{i \\in \\text{star}(s)} Z_i, \\quad B_p = \\bigotimes_{i \\in \\text{plaquette}(p)} X_i \\]"},{"type":"paragraph","text":"Errors are detected through the stabilizer measurement syndrome: each stabilizer is measured in every QEC cycle, returning +1 (no error detected) or -1 (error detected). A single-qubit bit-flip error (\\(X\\)) flips the two adjacent plaquette stabilizers; a phase-flip error (\\(Z\\)) flips the two adjacent star stabilizers. Because stabilizers are local (only involving 4 qubits), errors produce local signatures. The decoder's job is to find the most likely error chain consistent with the measured syndrome, which in practice maps to a minimum-weight perfect matching problem on a graph. The logical error rate scales as \\(p_L \\propto (p/p_{\\text{th}})^{\\lfloor (d+1)/2 \\rfloor}\\) where \\(p\\) is the physical error rate, \\(p_{\\text{th}} \\approx 0.11\\) is the threshold, and \\(d\\) is the code distance."},{"type":"subheading","text":"Google's Dynamic Surface Codes Breakthrough"},{"type":"paragraph","text":"In January 2026, Google Quantum AI demonstrated a fundamental extension of surface code QEC on their Willow processor: dynamic circuits that alternate between different tiling patterns each cycle. Standard surface codes use a fixed tiling of detecting regions (static square lattice). Google showed three dynamic variants that each solve specific hardware limitations. The hexagonal lattice reduces couplers per qubit from 4 to 3, simplifying frequency optimization. The walking circuit periodically swaps data and measure qubit roles, eliminating leakage on data qubits without extra gates — reducing time-correlated errors by an order of magnitude. The iSWAP gate code replaces CZ gates with iSWAP gates that avoid non-computational states, generating fewer correlated errors. All three performed below threshold, with error suppression improving with code distance."},{"type":"formula","text":"\\[ p_L \\propto \\left(\\frac{p}{p_{\\text{th}}}\\right)^{\\lfloor (d+1)/2 \\rfloor} \\quad \\text{where } p_{\\text{th}} \\approx 0.11, \\, d = \\text{code distance} \\]"},{"type":"paragraph","text":"The practical significance: dynamic circuits decouple the hardware geometry from the error correction topology. A square-lattice processor can simulate a hexagonal code by turning off some couplers. A failed qubit or coupler (dropout) can be circumvented by re-tiling the detecting regions — no hardware redesign needed. This opens the path to co-designing quantum hardware and error correction protocols, with Google targeting fewer than 1 error per million QEC cycles as their next milestone. Alongside recent color code demonstrations, dynamic surface codes establish multiple viable paths to fault-tolerant quantum computing."},{"type":"subheading","text":"Why This Matters for ML Researchers"},{"type":"paragraph","text":"The decoding problem for surface codes — finding the most likely error configuration consistent with noisy syndrome measurements — is a latent-variable inference problem on a graphical model. Recent work applies neural belief propagation and transformer-based decoders that outperform traditional MWPM on circuit-level noise. For PGDR researchers specifically, surface code decoders face a distribution shift problem: decoder training data comes from low-noise regimes, but decoders must generalize to rare high-noise events (logical errors). Robustness techniques from the worst-group generalization literature could directly improve decoder reliability at the system level, where a single undetected logical error can invalidate an entire quantum computation."}],"mathContent":[{"type":"section_heading","text":"CONCEPT"},{"type":"heading","text":"Darts in Higher Dimensions — Probability Meets Volumes of Even-Dimensional Balls"},{"type":"paragraph","text":"A deceptively simple dartboard puzzle produces a beautiful connection between probability, high-dimensional geometry, and Euler's number \\(e\\). The game: throw darts uniformly at random at a square board of side length 2. The bullseye is a circle of radius 1 centered inside. After each hit, the bullseye shrinks: the new radius equals the perpendicular distance from the center to the chord drawn through your previous hit. Question: what is the expected score of a random player? The answer is \\(e^{\\pi/4} \\approx 2.193\\), derived without calculus by recognizing hidden high-dimensional geometry."},{"type":"paragraph","text":"The derivation proceeds by induction. The probability of hitting the first dart is simply the area ratio: \\(P(\\text{score} \\geq 2) = \\pi/4\\). After the first hit at distance \\(h_0\\) from center, the new radius is \\(r_1 = \\sqrt{1 - h_0^2}\\). The second dart must land inside a circle of this radius. The joint condition for both darts is \\(x_0^2 + y_0^2 + x_1^2 + y_1^2 < 1\\), which uses 4 coordinates — equivalently, a point in 4-dimensional space inside a 4-ball of radius 1. The probability of two hits is the volume of a 4-ball divided by the volume of the enclosing 4-cube of side 2."},{"type":"formula","text":"\\[ P(\\text{score} \\geq n+1) = \\frac{\\text{Vol}(B^{2n})}{\\text{Vol}(C^{2n})} = \\frac{\\pi^n / n!}{4^n} = \\frac{(\\pi/4)^n}{n!} \\]"},{"type":"paragraph","text":"The volume of a \\(2n\\)-dimensional ball of radius 1 is \\(\\pi^n / n!\\). The volume of the containing \\(2n\\)-cube of side 2 is \\(2^{2n} = 4^n\\). So the probability of hitting \\(n+1\\) darts (i.e., surviving \\(n\\) consecutive hits) is \\((\\pi/4)^n / n!\\). The expected score is the sum over all survival probabilities from \\(k=1\\) to \\(\\infty\\) of \\(P(\\text{score} \\geq k)\\): the first term is 1 (you always throw at least once), then \\(\\pi/4\\), then \\((\\pi/4)^2/2!\\), then \\((\\pi/4)^3/3!\\), and so on — exactly the Taylor series for \\(e^x\\) evaluated at \\(x = \\pi/4\\)."},{"type":"formula","text":"\\[ \\mathbb{E}[\\text{score}] = \\sum_{k=1}^{\\infty} P(\\text{score} \\geq k) = 1 + \\frac{\\pi}{4} + \\frac{(\\pi/4)^2}{2!} + \\frac{(\\pi/4)^3}{3!} + \\cdots = e^{\\pi/4} \\]"},{"type":"paragraph","text":"This result, originally due to science fiction author Greg Egan, illustrates a powerful technique: encoding many random variables as a single point in high-dimensional space and computing probabilities as volume ratios. The volumes of high-dimensional balls become extremely small — a 100-dimensional ball of radius 1 occupies only about \\(2.368 \\times 10^{-40}\\) of its enclosing cube — which explains why high-dimensional probability is dominated by thin shells near the surface rather than the central region. Grant Sanderson (3Blue1Brown) gives a masterful visual explanation of why the series naturally sums to \\(e\\) without ever explicitly writing a Taylor expansion."},{"type":"video","video":{"title":"Darts in Higher Dimensions (with 3Blue1Brown) — Numberphile","channel":"Numberphile","duration":"32:11","url":"https://www.youtube.com/watch?v=6_yU9eJ0NxA"}}],"deepContent":[{"type":"section_heading","text":"ANALYSIS"},{"type":"heading","text":"The Pack Hunt Jailbreak: Why Frontier AI Safety Is Fundamentally Harder Than It Looks"},{"type":"paragraph","text":"The jailbreak of Anthropic's Fable 5 within 24 hours of release — followed by a US government export ban that pulled the model globally — marks a pivotal moment for frontier AI safety. The 'pack hunt' technique used by Pliny the Liberator was not a sophisticated model-weight exploit. It was a decomposition attack: break a harmful request into benign sub-questions that individually fall below the classifier threshold, extract each piece from the model, then reassemble externally. This is possible because safety classifiers operate on individual turns, not on the compositional intent across turns. The attacker maintains a multi-turn 'working memory' externally (or via a second model) to track what pieces have been gathered."},{"type":"subheading","text":"The Classifier vs. Weights Distinction"},{"type":"paragraph","text":"Anthropic's safety architecture for Fable 5 routes high-risk requests to a restricted fallback model (Claude Opus 4.8) via a classifier layer — it does not bake refusal behavior into Fable 5's weights. This design choice has a deep implication: the model retains latent capability for harmful tasks; it merely has a routing guardrail in front. When the classifier is bypassed via decomposition, the full capability is available. By contrast, refusal baked into model weights (e.g., via RLHF directly optimizing the policy to refuse harmful requests) is harder to bypass because the model literally loses the capability to complete harmful chains. Pliny's leaked 120,000-character system prompt — the first complete system prompt of a Mythos-class model — revealed the full extent of Anthropic's safety engineering and immediately became a public reference for adversarial prompt engineering."},{"type":"subheading","text":"Why Decomposition Attacks Are Fundamentally Hard to Defend Against"},{"type":"paragraph","text":"The decomposition/recomposition attack exploits a property of all current LLM architectures: the classifier operates on surface form, not on latent intent. There are exponentially many ways to decompose a request, and the attacker only needs one chain where each sub-query individually passes the classifier. This is a search problem for the attacker and a coverage problem for the defender. As model context windows grow (Fable 5's was likely very large given the 120K system prompt), the attacker's search space increases — they can embed sub-questions in long innocuous contexts where the classifier struggles to isolate intent. Recent research on multi-turn jailbreaking (arXiv:2601.05339, ACL 2025 REALM) shows decomposition attack success rates exceeding 90% across frontier models including GPT-4 and Gemini."},{"type":"formula","text":"\\[ \\text{Attack complexity: } |\\mathcal{D}| = \\sum_{k=1}^{K} \\binom{N}{k} \\cdot f(k) \\;\\text{where } N \\text{ is sub-question vocabulary} \\]"},{"type":"paragraph","text":"The search space of possible decompositions grows combinatorially with the number of sub-questions \\(k\\) and the vocabulary of benign phrasings \\(f(k)\\). This makes exhaustive coverage impossible — the defender must instead detect compositional intent, which requires reasoning about the relationship between queries rather than evaluating each independently. Current classifiers are fundamentally local: they evaluate each user turn without maintaining a latent representation of the attacker's overall goal across turns. Until models can reason about multi-turn intent, decomposition attacks will remain an open vulnerability."},{"type":"subheading","text":"The Regulatory Ripple Effect"},{"type":"paragraph","text":"The US government's response — an export control order banning foreign nationals from accessing Fable 5 and Mythos 5 — raises deeper questions. The ban was triggered by verbal evidence of a 'potential narrow, non-universal jailbreak,' a standard that Anthropic argues would halt all frontier model deployments if applied industry-wide. The selective enforcement (GPT-5.5 and Gemini 3.1 Pro remain unrestricted) suggests political motivations beyond pure safety: Anthropic's refusal to allow military domestic surveillance use, its ongoing lawsuit against the administration, and its impending IPO all likely factor in. The 'hardware sovereignty' movement — enterprises seeking to own and control AI infrastructure to avoid government recall risks — is a direct consequence. For the first time, model availability is a risk variable in enterprise procurement, and the lesson is clear: multi-vendor strategy, fallback to open-weight models, and self-hosted deployments are now operational necessities."}]};

function renderTechNews() {
  return `<div style="background: var(--tn-bg); padding: 48px 24px 80px; min-height: 100%;">
    <h1 style="font-family: Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; color: var(--tn-accent); border-bottom: 4px solid var(--tn-accent); padding-bottom: 24px; margin-bottom: 48px;">Tech News — ${data.date}</h1>
    <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;">
      ${data.articles.map(a => `<div style="grid-column: span ${a.cols}; background: var(--tn-card); border: 2px solid var(--tn-border); padding: 24px;">
        <span style="display: inline-block; background: var(--tn-accent); color: var(--tn-bg); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 10px; margin-bottom: 16px; font-family: 'IBM Plex Mono'; text-transform: uppercase;">${a.category}</span>
        <h2 style="font-family: Georgia, serif; font-size: ${a.cols === 12 ? '36px' : '20px'}; font-weight: 700; color: var(--tn-ink); line-height: 1.12; margin-bottom: ${a.cols === 12 ? '20px' : '12px'};">${a.title}</h2>
        <p style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--tn-meta); margin-bottom: 14px;">${a.source} · ${a.date}</p>
        <p style="font-family: 'IBM Plex Sans'; font-size: ${a.cols === 12 ? '16px' : '14px'}; line-height: 1.65; color: var(--tn-ink); opacity: 0.78;">${a.summary}</p>
        <a href="${a.url}" target="_blank" style="display: inline-block; font-size: 12px; font-weight: 600; color: var(--tn-accent); border-bottom: 1.5px solid var(--tn-accent); margin-top: 20px; text-decoration: none;">Read Full Article →</a>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderContent(blocks, bgVar, textVar, accentVar, fbgVar) {
  return blocks.map(b => {
    if (b.type === 'section_heading') return `<p style="font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(${accentVar}); opacity: 0.65; margin-bottom: 16px;">${b.text}</p>`;
    if (b.type === 'heading') return `<h2 style="font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(${accentVar}); margin-bottom: 24px;">${b.text}</h2>`;
    if (b.type === 'paragraph') return `<p style="font-family: Georgia, serif; font-size: 18px; line-height: 1.8; color: var(${textVar}); text-align: justify; margin-bottom: 20px;">${b.text}</p>`;
    if (b.type === 'formula') return `<div style="padding: 28px 20px; margin: 32px 0; text-align: center; border-left: 3px solid var(${accentVar}); background: var(${fbgVar}); color: var(${textVar});">${b.text}</div>`;
    if (b.type === 'subheading') return `<h3 style="font-family: Georgia, serif; font-size: 22px; font-weight: 600; color: var(${textVar}); margin-top: 44px; margin-bottom: 20px;">${b.text}</h3>`;
    if (b.type === 'video') return `<div style="background: var(--mt-vbg); border: 2px solid var(${accentVar}); border-radius: 6px; padding: 24px; margin: 32px 0; display: flex; align-items: center; gap: 20px;">
      <span style="font-size: 30px;">🎥</span>
      <div style="flex: 1;">
        <p style="font-family: 'IBM Plex Sans'; font-weight: 700; font-size: 16px; margin-bottom: 6px;">${b.video.title}</p>
        <p style="font-family: 'IBM Plex Mono'; font-size: 12px; opacity: 0.6;">${b.video.channel} · ${b.video.duration}</p>
      </div>
      <a href="${b.video.url}" target="_blank" style="background: var(${accentVar}); color: var(${bgVar}); padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 4px; text-decoration: none;">Watch</a>
    </div>`;
    return '';
  }).join('');
}

function showTab(n) {
  tab = n;
  document.querySelectorAll('[id^=tab]').forEach((el, i) => {
    el.style.borderBottomColor = i === n ? 'var(--tab-active)' : 'transparent';
    el.style.color = i === n ? 'var(--tab-active)' : 'var(--tab-muted)';
    el.style.fontWeight = i === n ? '600' : '400';
  });
  document.getElementById('pageNum').textContent = `Page ${n + 1} of 4`;

  const content = document.getElementById('content');
  if (n === 0) content.innerHTML = renderTechNews();
  else if (n === 1) content.innerHTML = `<div style="background: var(--ph-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.physicsContent, '--ph-bg', '--ph-text', '--ph-accent', '--ph-fbg')}</div></div>`;
  else if (n === 2) content.innerHTML = `<div style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.mathContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;
  else content.innerHTML = `<div style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.deepContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;

  if (window.katex) {
    document.querySelectorAll('.katex').forEach(el => {
      try {
        const math = el.textContent.replace(/^\[/, '').replace(/\]$/, '').trim();
        el.innerHTML = window.katex.renderToString(math, { displayMode: true });
      } catch(e) {}
    });
  }
  if (window.MathJax) {
    MathJax.typesetPromise([document.getElementById('content')]).catch(e => {});
  }
}

function nextTab() { if (tab < 3) showTab(tab + 1); }
function prevTab() { if (tab > 0) showTab(tab - 1); }

showTab(0);
</script>
</body>
</html>
