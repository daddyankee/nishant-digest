<script>
const data = {"date":"June 20, 2026","dayOfWeek":"Saturday","articles":[{"category":"AI","cols":12,"title":"John Jumper to Join Anthropic — Nobel Laureate and AlphaFold Creator Makes Historic AI Lab Move","source":"Twitter / Hacker News","date":"Jun 19, 2026","summary":"John Jumper, who won the 2024 Nobel Prize in Chemistry for creating AlphaFold at Google DeepMind, announced he is joining Anthropic. The move, which drew 144 points and 107 comments on HN within hours, represents one of the most significant AI talent transfers ever — a Nobel laureate moving between frontier AI labs. Jumper's departure from DeepMind follows a pattern of senior exits, while Anthropic gains a scientist whose work on protein structure prediction transformed computational biology. The hire signals Anthropic's ambition to expand beyond language models into scientific AI, potentially applying AlphaFold-style approaches to drug discovery and materials science within a safety-first framework.","url":"https://twitter.com/JohnJumperSci/status/2068001285173834106"},{"category":"POLICY","cols":6,"title":"Norway Imposes Near-Ban on AI in Elementary Schools — 705 HN Points","source":"Reuters","date":"Jun 19, 2026","summary":"Norway announced a sweeping near-ban on AI use in elementary education, limiting AI tools to supervised, curriculum-aligned applications only. The policy, which generated 488 comments on Hacker News, makes Norway the first country to impose such strict educational AI restrictions. The government cited concerns about cognitive development, data privacy, and the risk of AI replacing foundational learning. The decision contrasts sharply with countries like South Korea and Singapore that are aggressively integrating AI into early education, setting up a global policy divergence on children and AI.","url":"https://www.reuters.com/technology/norway-imposes-near-ban-ai-elementary-school-2026-06-19/"},{"category":"AI","cols":6,"title":"GPT-5.5 Hallucinates 3× More Than MIT-Licensed GLM-5.2, Independent Tests Show","source":"arrowtsx.dev / Hacker News","date":"Jun 19, 2026","summary":"Independent benchmarking by developer ArrowTsx found that OpenAI's GPT-5.5 hallucinates at roughly triple the rate of Z.AI's MIT-licensed GLM-5.2 across factuality tests in coding and general knowledge tasks. The findings, which reached 233 HN points, challenge the narrative that larger proprietary models necessarily outperform smaller open ones on reliability. GLM-5.2, previously reported as leading frontend coding benchmarks, continues to demonstrate competitive or superior performance at a fraction of the operational cost, intensifying the open-source vs. proprietary model debate as OpenAI prepares for IPO.","url":"https://arrowtsx.dev/bigger-models/"},{"category":"AI","cols":6,"title":"OpenAI Lands Transformer Co-Inventor Noam Shazeer and Former Trump AI Advisor Dean Ball Ahead of IPO","source":"TechCrunch","date":"Jun 18, 2026","summary":"OpenAI made two high-profile hires in a single week: Noam Shazeer, co-inventor of the Transformer architecture, from Google DeepMind, and Dean Ball, former Trump administration AI policy official. Shazeer's move, following his founding of Character.AI, brings core architecture expertise back to OpenAI as it prepares for a blockbuster IPO. Ball's addition signals OpenAI's recognition that policy navigation — particularly around the ongoing Anthropic export control controversy — will be critical to its public-market narrative. The twin hires underscore the intensifying talent war among frontier labs.","url":"https://techcrunch.com/2026/06/18/openai-is-bringing-on-some-big-guns-in-the-lead-up-to-its-ipo/"},{"category":"AI","cols":6,"title":"Billionaire Ambani to Embed AI Across 500M-User Jio Telecom Network in India","source":"TechCrunch","date":"Jun 19, 2026","summary":"Mukesh Ambani's Reliance Jio Platforms announced plans to embed AI into every layer of its telecommunications services — calls, apps, and smart home devices — reaching over 500 million Indian users. The AI integration spans voice assistants for feature phones, AI-powered customer support, and smart home automation through Jio's broadband network. The scale of deployment makes this one of the largest consumer AI rollouts globally, positioning India as a testbed for AI-at-scale in emerging markets where mobile-first, low-cost deployment models differ fundamentally from the US and EU enterprise-led approaches.","url":"https://techcrunch.com/2026/06/19/billionaire-ambani-wants-ai-in-every-call-app-and-home/"},{"category":"SECURITY","cols":6,"title":"Microsoft Discovers 'Crypto Clipper' — Self-Propagating Worm Uses Tor for Stealth Command and Control","source":"Ars Technica","date":"Jun 18, 2026","summary":"Microsoft detailed a new malware family dubbed Crypto Clipper that spreads via USB drives, monitors clipboards for cryptocurrency wallet addresses, and routes stolen data through Tor using a local SOCKS5 proxy. The malware's architecture is notable for lacking traditional C2 infrastructure — it deploys a portable Tor client and blends credential theft with remote code execution, effectively turning a financially motivated stealer into a lightweight backdoor. The worm-like propagation and Tor-based stealth make detection difficult for conventional network monitoring tools.","url":"https://arstechnica.com/security/2026/06/microsoft-spots-new-self-propagating-malware-for-stealing-cryptocurrency/"},{"category":"POLICY","cols":6,"title":"FERC Mandates Fast-Lane Grid Interconnection for AI Data Centers, Sidesteps Electricity Supply Question","source":"TechCrunch","date":"Jun 18, 2026","summary":"The Federal Energy Regulatory Commission ordered grid operators to give AI data centers priority interconnection, effectively creating a government-mandated fast lane to the electrical grid. The order addresses interconnection queue backlogs that have delayed data center buildouts for years but conspicuously failed to address the supply side — where new power generation must be built to meet surging AI demand. The policy prioritizes data centers over other industrial users, raising questions about grid equity as AI infrastructure competes with manufacturing, housing, and other critical loads for limited interconnection capacity.","url":"https://techcrunch.com/2026/06/18/ai-data-centers-just-got-a-government-mandated-fast-lane-to-the-grid/"},{"category":"HARDWARE","cols":6,"title":"Nothing Cancels CMF Phone, Blames 'RAMageddon' as Memory Prices Double","source":"The Verge","date":"Jun 19, 2026","summary":"Nothing canceled its upcoming CMF budget phone, with co-founder Akis Evangelidis citing memory prices that have roughly doubled. CEO Carl Pei separately noted that memory costs for the mid-range Phone 4A also doubled, compressing margins across the product line. The cancellation is the latest evidence that the global RAM shortage — driven by AI data center demand for HBM and DDR5 — is cascading into consumer electronics, forcing hardware makers to raise prices, delay products, or cancel budget lines entirely. Apple's Tim Cook had previously warned of unavoidable iPhone price hikes due to the same shortage.","url":"https://www.theverge.com/gadgets/953066/nothing-cmf-phone-delayed-ram-prices"},{"category":"AI","cols":6,"title":"Amazon MGM Drops Luca Guadagnino's Sam Altman Film 'Artificial' Starring Andrew Garfield","source":"The Verge","date":"Jun 19, 2026","summary":"Amazon MGM has dropped Luca Guadagnino's film 'Artificial,' about the five-day 2023 saga of Sam Altman's firing and reinstatement as OpenAI CEO, which had been in production for a year. The film starred Andrew Garfield as Altman, Monica Barbaro as CTO Mira Murati, and Ike Barinholtz as Elon Musk. Amazon stated the film 'will be better served if it were released by a different studio,' though the timing — amid OpenAI's IPO preparations and the ongoing Anthropic government controversy — suggests growing sensitivity around AI industry portrayals as these companies transition to public markets.","url":"https://www.theverge.com/ai-artificial-intelligence/952906/sam-altman-film-artificial-openai-amazon-mgm-dropped"},{"category":"NEWS","cols":4,"title":"NASA Selects Eric Schmidt's Relativity Space for 2028 Mars Atmospheric Mission","source":"The Verge","date":"Jun 19, 2026","summary":"NASA selected Relativity Space, the rocket company led by former Google CEO Eric Schmidt, to launch the Aeolus payload to Mars in 2028 under a new public-private partnership. The mission will provide the first integrated daily global view of Martian winds, temperatures, dust, and clouds, directly informing future entry, descent, and landing systems. The selection sets up a Mars race with SpaceX, which has its own uncrewed Mars ambitions.","url":"https://www.theverge.com/science/952988/nasa-relativity-space-eric-schmidt-mars"},{"category":"STARTUPS","cols":4,"title":"Every Fusion Startup That Has Raised Over $100M — $7.1B Invested Across the Sector","source":"TechCrunch","date":"Jun 19, 2026","summary":"TechCrunch published a comprehensive roundup of every fusion energy startup that has raised over $100 million, tallying $7.1 billion in total investment. Major players include Commonwealth Fusion Systems, Helion Energy, TAE Technologies, and General Fusion. The analysis reveals concentration risk — a handful of companies hold the majority of capital — while the sector has yet to achieve net energy gain at commercial scale, highlighting both the ambition and the uncertainty of fusion as a climate solution.","url":"https://techcrunch.com/2026/06/19/every-fusion-startup-that-has-raised-over-100m/"},{"category":"ROBOTICS","cols":4,"title":"VLC Creator Jean-Baptiste Kempf Now Building Kyber — Open-Source Robot Control Infrastructure","source":"TechCrunch","date":"Jun 20, 2026","summary":"Jean-Baptiste Kempf, the French developer who created VLC media player and built it into one of the world's most widely used open-source projects, is now building Kyber — an infrastructure layer for real-time remote device control targeting robotics and physical AI. Kyber aims to solve the latency, reliability, and interoperability problems that plague robot fleets, applying open-source principles honed over two decades at VideoLAN to the physical world. Kempf's pivot from software to hardware control represents a pattern of veteran open-source developers moving into robotics infrastructure.","url":"https://techcrunch.com/2026/06/19/he-made-your-free-video-player-run-smoothly-now-hes-doing-that-for-robots/"},{"category":"AI","cols":4,"title":"Dan Abramov: 'There Are No Instances in ATProto' — 465 HN Points","source":"overreacted.io / Hacker News","date":"Jun 19, 2026","summary":"React core team member Dan Abramov published a deep architectural analysis of Bluesky's AT Protocol, arguing that the common 'federated instances' framing is misleading — ATProto has no server-level instances in the ActivityPub sense. The post, which sparked 234 comments on HN, explains how ATProto's architecture separates identity, data storage, and feed generation in ways that make it fundamentally different from Mastodon's federation model. The analysis is essential reading for engineers building on decentralized social protocols.","url":"https://overreacted.io/there-are-no-instances-in-atproto/"},{"category":"SECURITY","cols":4,"title":"Satellite Data Reveals 'Immense Scale' of Worldwide GPS Signal Tampering","source":"Space.com","date":"Jun 20, 2026","summary":"New satellite analysis reveals GPS signal tampering at a scale far beyond previous estimates, with widespread spoofing and jamming detected across multiple continents. The findings, based on data from low-Earth orbit satellites, show that GPS interference — long known as a military tactic — is now affecting civilian aviation, maritime navigation, and financial timestamping at a global scale. Researchers described the scope as 'quite a bit more than we expected,' raising urgent infrastructure security questions.","url":"https://www.space.com/space-exploration/satellites/its-quite-a-bit-more-than-we-expected-satellite-reveals-immense-scale-of-gps-signal-tampering"},{"category":"STARTUPS","cols":4,"title":"Japan's Go Raises ¥88.6B in Record IPO, Eyes Robotaxi Fleet and Acquisitions","source":"TechCrunch","date":"Jun 19, 2026","summary":"Japanese taxi-hailing app Go completed Japan's largest IPO of 2026 at ¥88.6 billion (~$590M), with plans to deploy capital toward robotaxi fleet development and strategic acquisitions. The company aims to address Japan's acute driver shortage through autonomous vehicle deployment. The successful listing provides a rare bright spot in Japan's otherwise sluggish IPO market and signals investor appetite for mobility-tech companies with autonomous roadmaps.","url":"https://techcrunch.com/2026/06/19/go-eyes-robotaxis-and-acquisitions-after-japans-biggest-ipo-of-2026-heres-why-it-matters/"},{"category":"HARDWARE","cols":4,"title":"Project Valhalla Arrives in JDK 28 After a Decade — Value Types and Specialized Generics","source":"jvm-weekly.com / Hacker News","date":"Jun 19, 2026","summary":"Project Valhalla, a decade-long effort to bring value types and specialized generics to Java, shipped in JDK 28. The release enables flat memory layouts for user-defined types, eliminating pointer indirection and improving cache locality — changes that bring Java's memory model closer to C++ for performance-critical workloads. The 604-point HN discussion highlighted how Valhalla's value objects could significantly improve Java's competitiveness in ML inference serving, where memory layout and allocation pressure are performance-critical.","url":"https://www.jvm-weekly.com/p/project-valhalla-explained-how-a"},{"category":"NEWS","cols":4,"title":"Aura Launches Impressive E-Ink Photo Frame That 'Doesn't Even Look Digital'","source":"TechCrunch","date":"Jun 19, 2026","summary":"Aura released the Aura Ink, an e-ink digital photo frame that renders black-and-white photographs with a matte, analog appearance indistinguishable from printed photos. Unlike conventional LCD digital frames, the e-ink display consumes power only when changing images and produces no backlight glare. The product targets a growing market for 'calm technology' — devices that blend into living spaces rather than demanding attention — continuing the e-ink renaissance driven by devices like the reMarkable tablet.","url":"https://techcrunch.com/2026/06/19/auras-impressive-e-ink-photo-frame-doesnt-even-look-digital/"},{"category":"POLICY","cols":4,"title":"EFF: Court Records Should Be Free — 390 HN Points","source":"Electronic Frontier Foundation","date":"Jun 19, 2026","summary":"The EFF published a detailed argument that US federal court records — currently locked behind the PACER paywall at $0.10 per page — should be freely accessible to the public. The post, which reached 390 points and 85 comments on HN, documents how PACER generated over $150 million in fees last year while technical costs to provide access have fallen to near zero. The call for free court records intersects with AI training data debates: restricted access to legal text limits the corpus available for training legal AI systems and perpetuates information asymmetry in the justice system.","url":"https://www.eff.org/deeplinks/2026/06/court-records-should-be-free"}],"physicsContent":[{"type":"section_heading","text":"NUCLEAR & PARTICLE PHYSICS"},{"type":"heading","text":"The Higgs Mechanism: How Particles Acquire Mass"},{"type":"paragraph","text":"In 1964, three independent groups — Peter Higgs; François Englert and Robert Brout; and Gerald Guralnik, Carl Hagen, and Tom Kibble — published papers proposing a mechanism that would become one of the most celebrated predictions in physics. The question they tackled was deceptively simple: why do fundamental particles have mass? In the Standard Model's mathematical framework, gauge symmetry forbids mass terms for force-carrying bosons, yet the W and Z bosons — carriers of the weak nuclear force — are massive. The Higgs mechanism resolves this contradiction by introducing a scalar field that fills all of space and spontaneously breaks electroweak symmetry."},{"type":"subheading","text":"The Mexican Hat Potential"},{"type":"formula","text":"\\[V(\\phi) = \\mu^2|\\phi|^2 + \\lambda|\\phi|^4\\]"},{"type":"paragraph","text":"The Higgs potential \\(V(\\phi)\\) has the famous 'Mexican hat' shape when \\(\\mu^2 < 0\\). The field \\(\\phi\\) is a complex doublet with four real components. At high energies (early universe), the minimum is at \\(\\phi = 0\\) and the full electroweak symmetry is intact. As the universe cooled, the field 'chose' a non-zero vacuum expectation value \\(v = \\sqrt{-\\mu^2/\\lambda} \\approx 246\\) GeV, spontaneously breaking the symmetry. Three of the four field components become the longitudinal polarizations of the W⁺, W⁻, and Z bosons — giving them mass — while the fourth becomes the observable Higgs boson, discovered at CERN's Large Hadron Collider in 2012."},{"type":"subheading","text":"Masses from a Single Mechanism"},{"type":"paragraph","text":"The brilliance of the Higgs mechanism is its universality. Fermions — quarks and leptons — acquire mass through Yukawa couplings to the Higgs field: \\(\\mathcal{L}_{\\text{Yukawa}} = -y_f \\bar{\\psi}_L \\phi \\psi_R + \\text{h.c.}\\), where \\(y_f\\) is the Yukawa coupling for each fermion. After symmetry breaking, this yields \\(m_f = y_f v / \\sqrt{2}\\). The electron's tiny Yukawa coupling (~\\(3 \\times 10^{-6}\\)) and the top quark's near-unity coupling (~0.99) reflect a hierarchy of interactions with the same field — a hierarchy that the Standard Model cannot explain, motivating searches for deeper theories."},{"type":"subheading","text":"Connections to Nuclear Physics"},{"type":"paragraph","text":"The Higgs mechanism is essential to nuclear physics because the mass of protons and neutrons — and therefore all atomic nuclei — is dominated not by the Higgs-generated quark masses (~1% of nucleon mass) but by quantum chromodynamics binding energy. The Higgs gives quarks their bare mass; QCD confinement provides the remaining 99%. Understanding this interplay — the origin of mass at both the electroweak and strong-force scales — remains one of the deepest questions connecting particle and nuclear physics. Lattice QCD calculations now reproduce the proton mass to within 1%, confirming that the Higgs-generated quark masses are just the seed around which the strong force builds the visible universe's mass."},{"type":"subheading","text":"Why It Matters for an ML/AI-Aware Reader"},{"type":"paragraph","text":"The Higgs mechanism illustrates a pattern familiar to ML practitioners: a high-dimensional symmetry that spontaneously breaks to produce structured, low-dimensional observables. The renormalization group flow that governs Higgs physics — how coupling constants change with energy scale — has direct mathematical parallels to the information bottleneck principle and renormalization-based approaches in deep learning. The 2012 Higgs discovery itself relied on neural network-based classifiers to distinguish signal from background in proton-proton collisions, making particle physics one of the earliest adopters of deep learning at scale. More profoundly, the search for physics beyond the Standard Model — supersymmetry, dark matter, neutrino masses — increasingly uses ML techniques for anomaly detection in high-dimensional collider data, a problem structurally similar to out-of-distribution detection in AI safety."}],"mathContent":[{"type":"section_heading","text":"FOURIER ANALYSIS"},{"type":"heading","text":"The Fourier Transform: From Heat Equation to Modern AI Infrastructure"},{"type":"paragraph","text":"In 1807, Joseph Fourier submitted a paper on heat diffusion to the French Academy of Sciences that was rejected by Lagrange and Laplace for lacking mathematical rigor. Fourier's claim — that any periodic function could be expressed as a sum of sines and cosines — was revolutionary, and eventually correct. The Fourier transform decomposes a signal into its constituent frequencies, revealing structure invisible in the time or spatial domain. Today, it underpins everything from JPEG compression to MRI reconstruction to the attention mechanism in transformer architectures."},{"type":"video","video":{"title":"But what is the Fourier Transform? A visual introduction","channel":"3Blue1Brown","duration":"20:57","url":"https://www.youtube.com/watch?v=spUNpyF58BY"}},{"type":"subheading","text":"The Core Equations"},{"type":"paragraph","text":"The continuous Fourier transform maps a function \\(f(t)\\) to its frequency-domain representation \\(\\hat{f}(\\omega)\\):"},{"type":"formula","text":"\\[\\hat{f}(\\omega) = \\int_{-\\infty}^{\\infty} f(t) e^{-2\\pi i \\omega t} dt\\]"},{"type":"paragraph","text":"The inverse transform reconstructs the original function from its frequency components:"},{"type":"formula","text":"\\[f(t) = \\int_{-\\infty}^{\\infty} \\hat{f}(\\omega) e^{2\\pi i \\omega t} d\\omega\\]"},{"type":"paragraph","text":"The key insight is that \\(e^{2\\pi i \\omega t}\\) acts as a 'frequency detector': multiplying \\(f(t)\\) by this complex exponential and integrating extracts exactly the component of \\(f\\) oscillating at frequency \\(\\omega\\). The complex exponential decomposes via Euler's formula \\(e^{i\\theta} = \\cos\\theta + i\\sin\\theta\\), making the Fourier transform an inner product between the signal and pure sinusoids."},{"type":"subheading","text":"The Convolution Theorem: Why Fourier Matters for Deep Learning"},{"type":"paragraph","text":"The convolution theorem states that convolution in the time/spatial domain becomes pointwise multiplication in the frequency domain:"},{"type":"formula","text":"\\[\\mathcal{F}\\{f * g\\} = \\mathcal{F}\\{f\\} \\cdot \\mathcal{F}\\{g\\}\\]"},{"type":"paragraph","text":"This is the mathematical engine behind convolutional neural networks. A CNN convolution layer with kernel \\(K\\) applied to input \\(X\\) computes \\(X * K\\). In the Fourier domain, this is simply \\(\\mathcal{F}(X) \\odot \\mathcal{F}(K)\\). While modern CNNs use direct spatial convolution for efficiency with small kernels, the Fast Fourier Transform (FFT) — which computes the discrete Fourier transform in \\(O(N \\log N)\\) instead of \\(O(N^2)\\) — enables efficient large-kernel convolutions. The FFT also powers the FNet architecture (Google, 2021), which replaces the quadratic-cost attention mechanism with Fourier-domain mixing, and underlies recent work on state space models (Mamba, S4) that use frequency-domain parameterizations for long-sequence modeling."},{"type":"subheading","text":"The Uncertainty Principle for Signal Processing"},{"type":"paragraph","text":"A fundamental trade-off emerges: a signal cannot be simultaneously localized in both time and frequency. If \\(f(t)\\) is sharply peaked in time (like a Dirac delta), its Fourier transform is infinitely spread across frequencies (a constant). Conversely, a pure sinusoid has perfect frequency localization but zero time localization. This is the same mathematical structure as Heisenberg's uncertainty principle in quantum mechanics — \\(\\Delta x \\Delta p \\geq \\hbar/2\\) — because position and momentum are Fourier duals. For ML practitioners, this manifests as the time-frequency resolution trade-off in spectrograms, the kernel-size vs. frequency-selectivity trade-off in CNNs, and the fundamental limit on how precisely attention mechanisms can attend to both position and content simultaneously."}],"deepContent":[{"type":"section_heading","text":"COMPUTATIONAL BIOLOGY & AI"},{"type":"heading","text":"Why John Jumper's Move to Anthropic Signals the Next Phase of AI-Driven Science"},{"type":"paragraph","text":"John Jumper's announcement that he is joining Anthropic is not just another AI talent transfer — it is a signal about the future of scientific AI and the strategic importance of computational biology to frontier AI labs. Jumper won the 2024 Nobel Prize in Chemistry for AlphaFold, a deep learning system that solved the 50-year protein folding problem by predicting 3D protein structures from amino acid sequences with atomic accuracy. His move from Google DeepMind to Anthropic raises two questions: why would a Nobel-winning computational biologist join an AI safety company, and what does this mean for the AI industry's relationship with scientific discovery?"},{"type":"subheading","text":"AlphaFold as an AI Paradigm"},{"type":"paragraph","text":"AlphaFold was not just a triumph for biology — it was a demonstration that deep learning could crack scientific problems that had resisted decades of experimental and theoretical effort. The system used a novel architecture combining evolutionary information (multiple sequence alignments) with a transformer-based structure module that iteratively refined protein geometry. The key insight was end-to-end differentiability: the entire pipeline from sequence to 3D coordinates was trained with a single loss function, allowing gradient signal to flow through geometric operations. This architecture pattern — learned representations of physical structure with end-to-end gradient flow — generalizes beyond proteins to materials science, drug binding, and chemical reaction prediction. The FAPE (Frame Aligned Point Error) loss function that AlphaFold introduced is essentially a geometric consistency check: do predicted residue positions maintain consistent relative positions regardless of the reference frame?"},{"type":"formula","text":"\\[\\mathcal{L}_{\\text{FAPE}} = \\frac{1}{N} \\sum_{i,j} \\left\\| T_i^{-1} \\circ \\mathbf{x}_j^{\\text{pred}} - T_i^{-1} \\circ \\mathbf{x}_j^{\\text{true}} \\right\\|\\]"},{"type":"subheading","text":"The Safety-Science Convergence"},{"type":"paragraph","text":"Anthropic's interest in Jumper reflects a strategic thesis: the same capabilities that make AI systems powerful for science — reasoning over complex structured domains, long-horizon planning, and generalization from limited data — also make them potentially dangerous. AlphaFold-level AI applied to drug discovery could design lifesaving medicines or deadly biochemical agents. Jumper spent his career building systems that map the fundamental machinery of biology; at Anthropic, the question becomes how to build such systems safely. This convergence is not hypothetical. The Mythos 5 controversy — where the US government forced a model offline over cybersecurity concerns — demonstrated that frontier AI capabilities have dual-use implications. Biology is the next domain where AI capability and AI risk collide, because the design space of proteins, pathways, and pathogens is vast, poorly constrained, and consequential."},{"type":"subheading","text":"What This Means for the AI Talent Market"},{"type":"paragraph","text":"Jumper's move follows a pattern: the frontier AI labs are no longer competing just for ML engineers — they are competing for domain scientists who can bridge deep disciplinary expertise with AI capabilities. OpenAI hired Noam Shazeer (Transformer architecture) and Dean Ball (AI policy) in the same week. Anthropic hired John Jumper (computational biology). Google DeepMind lost both. The competition is no longer about who has the best language model — it is about who can apply AI to the hardest scientific and societal problems while managing the associated risks. For ML engineers and researchers, the signal is clear: domain expertise in biology, chemistry, physics, or materials science combined with AI skills is becoming the most valuable professional profile in the industry. The era of the pure ML generalist is giving way to the era of the AI-fluent domain scientist."},{"type":"paragraph","text":"This also connects to today's news about Norway banning AI in elementary schools, open-source models like GLM-5.2 outperforming proprietary ones on reliability metrics, and FERC giving data centers a fast lane to the grid. Each story is a different facet of the same transformation: AI is moving from a pure software industry into the physical and institutional world. The compute to run it needs power. The models to deploy it need to be trustworthy. The people who build it need to understand both the technology and the domains it touches. And the Nobel laureates who pioneered AI-for-science are now choosing where — and under what safety framework — to build the next generation of systems."}]};
let tab = 0;

// Theme switching functionality
function setTheme(themeName) {
  const root = document.getElementById('root');
  root.setAttribute('data-theme', themeName);

  // Update active state on theme dots
  document.querySelectorAll('.theme-dot').forEach(dot => {
    if (dot.getAttribute('data-theme') === themeName) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });

  // Persist theme preference to localStorage
  try {
    localStorage.setItem('digest-theme', themeName);
  } catch(e) {
    console.error('Failed to save theme preference:', e);
  }
}

// Load saved theme on page load
function loadSavedTheme() {
  try {
    const savedTheme = localStorage.getItem('digest-theme');
    if (savedTheme && ['parchment', 'sepia', 'nordic', 'dusk', 'graphite'].includes(savedTheme)) {
      setTheme(savedTheme);
    } else {
      setTheme('parchment');
    }
  } catch(e) {
    console.error('Failed to load theme preference:', e);
    setTheme('parchment');
  }
}

function renderTechNews() {
  return `<div class="tech-news-container" style="background: var(--tn-bg); padding: 48px 24px 80px; min-height: 100%;">
    <h1 style="font-family: Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; color: var(--tn-accent); border-bottom: 4px solid var(--tn-accent); padding-bottom: 24px; margin-bottom: 48px;">Tech News — ${data.date}</h1>
    <div id="tech-grid" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;">
      ${data.articles.map(a => `<div style="grid-column: span ${a.cols}; background: var(--tn-card); border: 2px solid var(--tn-border); padding: 24px;">
        <span style="display: inline-block; background: var(--tn-accent); color: var(--tn-bg); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 10px; margin-bottom: 16px; font-family: 'IBM Plex Mono'; text-transform: uppercase;">${a.category}</span>
        <h2 class="${a.cols === 12 ? 'article-title-large' : 'article-title-small'}" style="font-family: Georgia, serif; font-size: ${a.cols === 12 ? '36px' : '20px'}; font-weight: 700; color: var(--tn-ink); line-height: 1.12; margin-bottom: ${a.cols === 12 ? '20px' : '12px'};">${a.title}</h2>
        <p style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--tn-meta); margin-bottom: 14px;">${a.source} · ${a.date}</p>
        <p class="article-summary" style="font-family: 'IBM Plex Sans'; font-size: ${a.cols === 12 ? '16px' : '14px'}; line-height: 1.65; color: var(--tn-ink); opacity: 0.78;">${a.summary}</p>
        <a href="${a.url}" target="_blank" style="display: inline-block; font-size: 12px; font-weight: 600; color: var(--tn-accent); border-bottom: 1.5px solid var(--tn-accent); margin-top: 20px; text-decoration: none;">Read Full Article →</a>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderContent(blocks, bgVar, textVar, accentVar, fbgVar) {
  return blocks.map(b => {
    if (b.type === 'section_heading') return `<p style="font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(${accentVar}); opacity: 0.65; margin-bottom: 16px;">${b.text}</p>`;
    if (b.type === 'heading') return `<h2 class="content-heading" style="font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(${accentVar}); margin-bottom: 24px;">${b.text}</h2>`;
    if (b.type === 'paragraph') return `<p class="content-paragraph" style="font-family: Georgia, serif; font-size: 18px; line-height: 1.8; color: var(${textVar}); text-align: justify; margin-bottom: 20px;">${b.text}</p>`;
    if (b.type === 'formula') return `<div class="formula-block" style="padding: 28px 20px; margin: 32px 0; text-align: center; border-left: 3px solid var(${accentVar}); background: var(${fbgVar}); color: var(${textVar});">${b.text}</div>`;
    if (b.type === 'subheading') return `<h3 class="content-subheading" style="font-family: Georgia, serif; font-size: 22px; font-weight: 600; color: var(${textVar}); margin-top: 44px; margin-bottom: 20px;">${b.text}</h3>`;
    if (b.type === 'video') return `<div class="video-card" style="background: var(--mt-vbg); border: 2px solid var(${accentVar}); border-radius: 6px; padding: 24px; margin: 32px 0; display: flex; align-items: center; gap: 20px;">
      <span style="font-size: 30px;">🎥</span>
      <div style="flex: 1;">
        <p style="font-family: 'IBM Plex Sans'; font-weight: 700; font-size: 16px; margin-bottom: 6px;">${b.video.title}</p>
        <p style="font-family: 'IBM Plex Mono'; font-size: 12px; opacity: 0.6;">${b.video.channel} · ${b.video.duration}</p>
      </div>
      <a href="${b.video.url}" target="_blank" style="background: var(${accentVar}); color: var(${bgVar}); padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 4px; text-decoration: none;">Watch</a>
    </div>`;
    return '';
  }).join('');
}

function showTab(n) {
  tab = n;
  document.querySelectorAll('[id^=tab]').forEach((el, i) => {
    el.style.borderBottomColor = i === n ? 'var(--tab-active)' : 'transparent';
    el.style.color = i === n ? 'var(--tab-active)' : 'var(--tab-muted)';
    el.style.fontWeight = i === n ? '600' : '400';
  });
  document.getElementById('pageNum').textContent = `Page ${n + 1} of 4`;

  const content = document.getElementById('content');
  if (n === 0) content.innerHTML = renderTechNews();
  else if (n === 1) content.innerHTML = `<div class="content-container" style="background: var(--ph-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.physicsContent, '--ph-bg', '--ph-text', '--ph-accent', '--ph-fbg')}</div></div>`;
  else if (n === 2) content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.mathContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;
  else content.innerHTML = `<div class="content-container" style="background: var(--mt-bg); padding: 64px 32px 96px; min-height: 100%;"><div style="max-width: 896px; margin: 0 auto;">${renderContent(data.deepContent, '--mt-bg', '--mt-text', '--mt-accent', '--mt-fbg')}</div></div>`;

  if (window.MathJax) {
    MathJax.typesetPromise([document.getElementById('content')]).catch(e => {});
  }
}

function nextTab() { if (tab < 3) showTab(tab + 1); }
function prevTab() { if (tab > 0) showTab(tab - 1); }

// Initialize on page load
loadSavedTheme();
showTab(0);
</script>
</body>
</html>
